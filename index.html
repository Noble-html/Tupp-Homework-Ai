 textarea{flex:1;min-height:54px;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px}.admin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.ops-card{padding:20px}.ops-card.wide{grid-column:1/-1}.ops-card h3{font-size:14px;letter-spacing:.06em}.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kpi-line{display:flex;justify-content:space-between;padding:12px;border-radius:12px;background:#f6f8fb;font-size:12px}.registry{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.registry span{color:var(--muted)}.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px}.class-list{margin-top:14px;max-height:420px;overflow:auto}.class-row{display:grid;grid-template-columns:110px 1fr 120px 180px;gap:10px;padding:11px;border-bottom:1px solid var(--line);font-size:12px}.class-row.pending{background:#fffdf4}.config{display:grid;gap:8px}.modal-bg{position:fixed;inset:0;background:rgba(8,12,20,.66);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}.modal{width:min(520px,100%);background:#fff;border-radius:24px;padding:24px;box-shadow:0 30px 100px rgba(0,0,0,.3);position:relative}.close{position:absolute;right:14px;top:10px;border:0;background:transparent;font-size:28px}.tabs{display:flex;gap:6px;background:#f3f5f8;padding:5px;border-radius:12px;margin:14px 0}.tabs button{flex:1;border:0;padding:10px;border-radius:9px;background:transparent;font-weight:900}.tabs button.active{background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.06)}.note{padding:11px 12px;border-radius:12px;background:#f6f8fb;color:#566074;font-size:11px;line-height:1.65;margin-top:12px}.footer{max-width:1240px;margin:0 auto;padding:0 22px 30px;color:#7b8496;font-size:11px}@media(max-width:900px){.hero{grid-template-columns:1fr}.hero-mark{display:none}.cards,.tracking-grid,.admin-grid,.ai-box{grid-template-columns:1fr}.nav{top:81px;overflow:auto;grid-template-columns:repeat(4,160px)}.stat- /* V47 secure entry gate */

:11px;line-height:1.7;color:#667085;background:#f6f8fc;border-radius:12px;padding:11px;margin-top:12px}.gate-config{display:none;margin-top:12px;padding:12px;background:#f6f8fc;border-radius:14px}.gate-config.open{display:block}.gate-config textarea{width:100%;min-height:110px;border:1px solid #dce2ec;border-radius:10px;padding:10px}.gate-secondary{background:#eef2f8!important;color:#1e293b!important}.gate-footer{font-size:11px;color:#8b96a8;line-height:1.6;margin-top:16px}@media(max-width:760px){#secureEntryGate{align-items:flex-start;padding:12px}.gate-shell{grid-template-columns:1fr;max-width:540px}.gate-intro{min-height:0;padding:22px}.gate-intro h1{font-size:36px;margin:18px 0 10px}.gate-intro .gate-extra{display:none}.gate-panel{padding:18px}.gate-form .gate-two{grid-template-columns:1fr}}


/* TUPP Homework AI only — premium NVIDIA-inspired visual system.
   All selectors are scoped to .ai-page so the school, tracking, admin, and entry UI
   retain their original appearance. */
.ai-page{--ai-green:#76b900;--ai-green-dark:#4d7b00;--ai-ink:#182116;--ai-muted:#697663;--ai-line:#e0e8d9;--ai-soft:#f7faf4;padding-top:26px;color:var(--ai-ink)}
.ai-page .nvidia-ai-hero{position:relative;isolation:isolate;overflow:hidden;border:1px solid #273921;border-radius:26px;padding:clamp(25px,4vw,48px);background:radial-gradient(ellipse at 88% 5%,rgba(118,185,0,.27),transparent 31%),radial-gradient(ellipse at 56% 120%,rgba(67,109,0,.25),transparent 42%),linear-gradient(122deg,#10170d 0%,#171f13 55%,#0b1008 100%);color:#f7fbf2;box-shadow:0 22px 54px rgba(20,39,10,.16);margin-bottom:20px}

.ai-page .nvidia-ai-hero:after{content:"";position:absolute;width:330px;height:330px;right:-105px;bottom:-230px;border:1px solid rgba(153,221,71,.42);border-radius:50%;box-shadow:0 0 0 25px rgba(118,185,0,.055),0 0 0 52px rgba(118,185,0,.035);pointer-events:none;z-index:-1}
.ai-page .ai-brandline{display:flex;align-items:center;gap:11px;margin-bottom:21px;flex-wrap:wrap}
.ai-page .nvidia-mark{display:grid;place-items:center;width:40px;height:32px;color:#8fce28}

.ai-page .nvidia-word{font-weight:950;letter-spacing:.09em;color:#f4f9ed;font-size:13px}
.ai-page .pill-live{display:inline-flex;align-items:center;gap:7px;border:1px solid #46632c;border-radius:999px;padding:6px 10px;color:#c8ee9e;font-size:9px;font-weight:900;letter-spacing:.13em;background:rgba(118,185,0,.11)}
.ai-page .pill-live i,.ai-page .chat-online{display:inline-block;width:7px;height:7px;border-radius:50%;background:#8fce28;box-shadow:0 0 12px rgba(143,206,40,.55)}
.ai-page .nvidia-ai-hero .eyebrow{color:#a8d86b;font-size:10px}

.ai-page .nvidia-ai-hero p{max-width:810px;line-height:1.8;color:#c6d2bb;margin-bottom:23px;font-size:14px}
.ai-page .ai-chip-row{display:flex;gap:8px;flex-wrap:wrap}
.ai-page .ai-chip-row span{font:800 9px ui-monospace,SFMono-Regular,monospace;letter-spacing:.1em;color:#d2e8bb;border:1px solid #34452b;background:rgba(9,14,7,.4);border-radius:7px;padding:8px 10px}
.ai-page .ai-workspace{display:grid;grid-template-columns:275px minmax(0,1fr);gap:17px;align-items:stretch}

.ai-page .ai-side-kicker,.ai-page .field-label{display:block;font-size:9px;font-weight:900;letter-spacing:.15em;color:#668d35;margin-bottom:9px}

.ai-page .prompt-card:hover{border-color:#9aca5c;background:#f8fced;box-shadow:0 7px 18px rgba(91,139,32,.09);transform:translateY(-1px)}

.ai-page .prompt-card b{font-size:12px;margin-bottom:5px;color:#26351e}
.ai-page .prompt-card span{font-size:10px;line-height:1.5;color:#71806a}

.ai-page .chat-topbar>div{display:grid;grid-template-columns:8px auto;column-gap:9px;align-items:center}

const state={app:null,auth:null,db:null,fb:{configured:false,booted:false,persistence:'not-initialized',retryCount:0,lastError:'',lastSuccessAt:null,activeListeners:0},listeners:new Set()};
const cfgKey='tupp_ai_v47_firebase_config';
const defaultFirebaseConfig={apiKey:'AIzaSyBi2-gI4R2hfEXEY2pyZr67jhpdVXEOt4k',authDomain:'tupp-homework-ai.firebaseapp.com',projectId:'tupp-homework-ai',storageBucket:'tupp-homework-ai.firebasestorage.app',messagingSenderId:'472435152177',appId:'1:472435152177:web:fc7cb9678163e5c9b74c10',measurementId:'G-51XL8R5BRQ'};
let savedConfig={};try{savedConfig=JSON.parse(localStorage.getItem(cfgKey)||'{}')}catch{}
let firebaseConfig={...defaultFirebaseConfig,...savedConfig};
function saveCfg(){localStorage.setItem(cfgKey,JSON.stringify(firebaseConfig));}
function firebaseConfigured(){return Boolean(firebaseConfig.apiKey&&firebaseConfig.authDomain&&firebaseConfig.projectId&&firebaseConfig.appId)}
async function initFirebase(){
 if(state.fb.booted)return;
 if(!firebaseConfigured())throw Error('ยังไม่ได้ตั้งค่า Firebase');
 state.app=getApps().length?getApps()[0]:initializeApp(firebaseConfig);state.auth=getAuth(state.app);state.db=getFirestore(state.app);
 try{await enableMultiTabIndexedDbPersistence(state.db);state.fb.persistence='enabled'}catch{state.fb.persistence='unavailable'}
 state.fb.booted=true;state.fb.configured=true;state.fb.lastSuccessAt=Date.now();render();
}
async function retry(fn,tries=5){let last;for(let i=0;i<tries;i++){try{const v=await fn();if(i)state.fb.retryCount++;state.fb.lastSuccessAt=Date.now();state.fb.lastError='';return v}catch(e){last=e;state.fb.lastError=e.message;if(i<tries-1)await new Promise(r=>setTimeout(r,500*Math.pow(2,i)))}}throw last}
async function councilLogin(email,password){
 await initFirebase();
 const cred=await retry(()=>signInWithEmailAndPassword(state.auth,email.trim().toLowerCase(),password));
 const snap=await retry(()=>getDoc(doc(state.db,'councilMembers',cred.user.uid)));
 if(!snap.exists()){await signOut(state.auth);throw Error('บัญชีนี้ไม่มีสิทธิ์ Council / Admin')}
 const m={id:snap.id,...snap.data()};
 if(m.active!==true||!Array.isArray(m.roles)||!m.roles.some(r=>['CAO','ADMIN','DCAO','SCAO','HSA'].includes(r))){await signOut(state.auth);throw Error('บัญชี Council ถูกระงับหรือยังไม่ได้รับสิทธิ์')}
 return {user:cred.user,member:m};
}
async function audit(event,payload={}){if(!state.db||!state.auth?.currentUser)return;return retry(()=>addDoc(collection(state.db,'audit'),{event,payload,actorUid:state.auth.currentUser.uid,createdAt:serverTimestamp()}))}
async function listHomework(studentId){await initFirebase();const q=query(collection(state.db,'homework'),where('studentId','==',studentId),limit(200));return new Promise((resolve,reject)=>{const stop=onSnapshot(q,s=>{state.fb.lastSuccessAt=Date.now();resolve(s.docs.map(d=>({id:d.id,...d.data()})))},e=>{state.fb.lastError=e.message;reject(e)});state.listeners.add(stop);state.fb.activeListeners=state.listeners.size})}
async function addHomework(data){await initFirebase();return retry(()=>addDoc(collection(state.db,'homework'),{...data,createdAt:serverTimestamp(),updatedAt:serverTimestamp()}))}
async function listClass(classRoom){await initFirebase();const q=query(collection(state.db,'homework'),where('classRoom','==',classRoom),limit(500));return new Promise((resolve,reject)=>{const stop=onSnapshot(q,s=>resolve(s.docs.map(d=>({id:d.id,...d.data()}))),reject);state.listeners.add(stop);state.fb.activeListeners=state.listeners.size})}
async function health(){await initFirebase();const t=performance.now();const s=await retry(()=>getDoc(doc(state.db,'system','health')));return{latency:Math.round(performance.now()-t),healthDocument:s.exists()}}

function tracking(){const now=Date.now();const pending=app.tasks.filter(x=>x.status==='PENDING');return `<section class="page"><div class="section-head"><div><span class="eyebrow">HOMEWORK TRACKING</span><h2>ติดตามงาน</h2><p>หน้าเดียวสำหรับบันทึกงาน ดู Deadline และแยกสถานะส่งแล้ว / ยังไม่ส่ง / เลยกำหนด</p></div><div class="tracking-badge">${pending.length} งานค้าง</div></div><div class="tracking-grid"><form class="panel" id="taskForm"><h3>บันทึกการบ้าน</h3><label>รหัสนักเรียน 5 หลัก<input id="studentId" inputmode="numeric" maxlength="5" value="${esc(app.studentId)}" placeholder="5-digit ID"/></label><label>ชื่องาน<input id="title" required value="${esc(app.form.title)}"/></label><label>วิชา<input id="subject" value="${esc(app.form.subject)}"/></label><label>กำหนดส่ง<input id="dueAt" type="datetime-local" value="${esc(app.form.dueAt)}"/></label><div class="two"><label>ความสำคัญ<select id="priority"><option ${app.form.priority==='NORMAL'?'selected':''}>NORMAL</option><option ${app.form.priority==='HIGH'?'selected':''}>HIGH</option><option ${app.form.priority==='URGENT'?'selected':''}>URGENT</option></select></label><label>คะแนนเต็ม<input id="scoreMax" type="number" min="0" value="${esc(app.form.scoreMax)}"/></label></div><label>หมายเหตุ<textarea id="note">${esc(app.form.note)}</textarea></label><button class="primary">บันทึกงานลง Firebase</button><div class="form-msg">${esc(app.status)}</div></form><div class="panel"><div class="panel-head"><div><h3>สถานะงาน</h3><span class="muted">ข้อมูลล่าสุดจาก Firestore</span></div><button class="ghost" id="refreshTasks">รีเฟรช</button></div><div class="stat-row"><div class="stat"><b>${app.tasks.length}</b><span>ทั้งหมด</span></div><div class="stat"><b>${app.tasks.filter(x=>x.status==='SUBMITTED').length}</b><span>ส่งแล้ว</span></div><div class="stat"><b>${pending.length}</b><span>ยังไม่ส่ง</span></div><div class="stat red"><b>${pending.filter(x=>x.dueAt&&new Date(x.dueAt).getTime()<now).length}</b><span>เลยกำหนด</span></div></div ct').value,dueAt:document.getElementById('dueAt').value,priority:document.getElementById('priority').value,scoreMax:document.getElementById('scoreMax').value,note:document.getElementById('note').value};try{await addHomework({...app.form,studentId:app.studentId,scoreMax:Number(app.form.scoreMax||0),classRoom:'',status:'PENDING',createdBy:app.session.uid});app.status='บันทึกการบ้านลง Firebase แล้ว';await loadTasks();app.form={title:'',subject:'',dueAt:'',priority:'NORMAL',scoreMax:'10',note:''};render()}catch(x){app.status=x.message;render()}});document.getElementById('refreshTasks')?.addEventListener('click',loadTasks);document.getElementById('sendAI')?.addEventListener('click',sendAI);document.getElementById('aiInput')?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendAI()}});document.getElementById('setEndpoint')?.addEventListener('click',()=>{const v=prompt('NVIDIA NIM endpoint',app.nvidiaEndpoint);if(v){app.nvidiaEndpoint=v;render()}});document.getElementById('systemCheck')?.addEventListener('click',async()=>{try{app.status='กำลังตรวจระบบ…';render();const r=await health();app.status=`Health document: ${r.healthDocument?'FOUND':'NOT FOUND'} • ${r.latency} ms`;render()}catch(e){app.status=e.message;render()}});document.getElementById('saveConfig')?.addEventListener('click',()=>{document.querySelectorAll('[data-cfg]').forEach(i=>firebaseConfig[i.dataset.cfg]=i.value.trim());saveCfg();state.app=state.auth=state.db=null;state.fb={configured:firebaseConfigured(),booted:false,persistence:'not-initialized',retryCount:0,lastError:'',lastSuccessAt:null,activeListeners:0};app.status='บันทึก Config แล้ว — กดรีโหลดหน้าเพื่อเริ่ม Firebase';render()});document.getElementById('loadClass')?.addEventListener('click',async()=>{app.classRoom=document.getElementById('classRoom').value.trim();try{app.classTasks=await listClass(app.classRoom);app.status=`โหลด ${app.classTasks.length} รายการ`;render()}catch(e){app.status=e.message;render()}})}

async function sendAI(){
 if(app.busy)return;const input=document.getElementById('aiInput');const q=(input?.value||'').trim();if(!q)return;
 const user=state.auth?.currentUser;if(!user){app.status='กรุณาเข้าสู่ระบบด้วยบัญชีที่ได้รับอนุมัติก่อนใช้ NVIDIA AI';app.messages.push({role:'model',text:'กรุณาเข้าสู่ระบบด้วยบัญชีที่ได้รับอนุมัติก่อนใช้งาน AI'});render();return}
 app.messages.push({role:'user',text:q});app.busy=true;render();
 try{const token=await user.getIdToken();const r=await fetch(app.nvidiaEndpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify({messages:app.messages.map(m=>({role:m.role==='user'?'user':'assistant',content:m.text}))})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`NVIDIA NIM request failed (${r.status})`);app.messages.push({role:'model',text:d.text||'NVIDIA NIM ไม่ได้ส่งข้อความตอบกลับ'});}
 catch(e){app.messages.push({role:'model',text:`เชื่อมต่อ NVIDIA NIM ไม่สำเร็จ: ${e.message}. หากเปิดไฟล์นี้โดยตรงจากเครื่อง ให้โฮสต์เว็บบนโดเมนที่มี /api/nvidia และตั้งค่า NVIDIA_API_KEY ฝั่งเซิร์ฟเวอร์ก่อน`})}
 finally{app.busy=false;render();setTimeout(()=>document.getElementById('chatLog')?.scrollTo({top:999999,behavior:'smooth'}),20)}
}
function drawLogos(){document.querySelectorAll('canvas[data-electric]').forEach(c=>{const ctx=c.getContext('2d');let dpr=devicePixelRatio||1;let raf;function fit(){const r=c.getBoundingClientRect();c.width=r.width*dpr;c.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}fit();let t=0;function frame(){t+=.025;const r=c.getBoundingClientRect(),w=r.width,h=r.height;ctx.clearRect(0,0,w,h);const cx=w/2,cy=h/2,s=Math.min(w,h);for(let k=0;k<6;k++){ctx.beginPath();for(let i=0;i<=220;i++){const a=i/220*Math.PI*2;const rr=s*(.25+.07*Math.sin(a*5+t*2+k*.7))+k*.5;const x=cx+Math.cos(a+t*.2+k)*rr;const y=cy+Math.sin(a+t*.2+k)*rr;const g=2.2*Math.sin(a*9+t*3+k)+Math.sin(a*17-t*2);const xx=x+g,yy=y+Math.cos(a*11+t+k)*2; i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.strokeStyle=k%2?'rgba(239,58,151,.33)':'rgba(22,136,255,.45)';ctx.lineWidth=1.3;ctx.stroke()}ctx.beginPath();ctx.arc(cx,cy,s*.22,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;ctx.stroke();raf=requestAnimationFrame(frame)}frame();window.addEventListener('resize',fit,{passive:true});c._electricStop=()=>cancelAnimationFrame(raf)})}

async function registerSchoolAccount({role,email,password,id,displayName,inviteToken='',bootstrapSecret=''}){
 await initFirebase();
 const cleanEmail=String(email||'').trim().toLowerCase();
 if(!/^\S+@\S+\.\S+$/.test(cleanEmail))throw Error('กรุณากรอกอีเมลที่ถูกต้อง');
 if(password.length<8)throw Error('รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร');
 if(role==='student'){
  if(!/@tupp\.ac\.th$/.test(cleanEmail))throw Error('อีเมลนักเรียนต้องลงท้ายด้วย @tupp.ac.th');
  if(!/^\d{5}$/.test(id))throw Error('รหัสนักเรียนต้องเป็นตัวเลข 5 หลัก');
  const cred=await retry(()=>createUserWithEmailAndPassword(state.auth,cleanEmail,password));
  try{await retry(()=>runTransaction(state.db,async tx=>{const idRef=doc(state.db,'studentIds',id);const existing=await tx.get(idRef);if(existing.exists())throw Error('รหัสนักเรียนนี้ถูกใช้ลงทะเบียนแล้ว');tx.set(idRef,{uid:cred.user.uid,createdAt:serverTimestamp()});tx.set(doc(state.db,'profiles',cred.user.uid),{uid:cred.user.uid,email:cleanEmail,role:'student',studentId:id,createdAt:serverTimestamp(),updatedAt:serverTimestamp()})}));}
  catch(e){try{await deleteUser(cred.user)}catch{}throw e}
  return {user:cred.user,profile:{uid:cred.user.uid,email:cleanEmail,role:'student',studentId:id}};
 }
 if(role==='teacher'){
  if(!isTuppEmail(cleanEmail))throw Error('อีเมลครูต้องลงท้ายด้วย @tupp.ac.th');
  if(!/^\d{5}$/.test(id))throw Error('รหัสประจำตัวครูต้องเป็นตัวเลข 5 หลัก');
  const parts=String(displayName||'').trim().split(/\s+/);const firstName=parts.shift()||'';const lastName=parts.join(' ');
  if(!firstName||!lastName)throw Error('กรุณากรอกชื่อและนามสกุลให้ครบ');
  const cred=await retry(()=>createUserWithEmailAndPassword(state.auth,cleanEmail,password));
  try{await retry(()=>runTransaction(state.db,async tx=>{const idRef=doc(state.db,'teacherIds',id);const existing=await tx.get(idRef);if(existing.exists())throw Error('รหัสประจำตัวครูนี้ถูกใช้ลงทะเบียนแล้ว');tx.set(idRef,{uid:cred.user.uid,createdAt:serverTimestamp()});tx.set(doc(state.db,'profiles',cred.user.uid),{uid:cred.user.uid,email:cleanEmail,role:'teacher_pending',teacherId:id,firstName,lastName,createdAt:serverTimestamp(),updatedAt:serverTimestamp()})}));}
  catch(e){try{await deleteUser(cred.user)}catch{}throw e}
  return {user:cred.user,profile:{uid:cred.user.uid,email:cleanEmail,role:'teacher_pending',teacherId:id,firstName,lastName}};
 }
 if(role==='admin'){
  if(!inviteToken&&!bootstrapSecret)throw Error('ต้องใช้ลิงก์เชิญแอดมินหรือรหัสเปิดระบบครั้งแรก');
  const cred=await retry(()=>createUserWithEmailAndPassword(state.auth,cleanEmail,password));
  try{await adminApi(inviteToken?'redeem':'bootstrap',{email:cleanEmail,inviteToken},bootstrapSecret);}
  catch(e){try{await deleteUser(cred.user)}catch{}throw e}
  const snap=await retry(()=>getDoc(doc(state.db,'councilMembers',cred.user.uid)));
  return {user:cred.user,member:snap.exists()?{id:snap.id,...snap.data()}:null,profile:null};
 }
 throw Error('ประเภทบัญชีไม่ถูกต้อง');
}
async function schoolAccountLogin(email,password){
 await initFirebase();
 const cred=await retry(()=>signInWithEmailAndPassword(state.auth,email.trim().toLowerCase(),password));
 const [councilSnap,profileSnap]=await Promise.all([retry(()=>getDoc(doc(state.db,'councilMembers',cred.user.uid))),retry(()=>getDoc(doc(state.db,'profiles',cred.user.uid)))]);
 if(councilSnap.exists()){
  const m={id:councilSnap.id,...councilSnap.data()};
  if(m.active!==true||!Array.isArray(m.roles)||!m.roles.some(r=>['CAO','ADMIN','DCAO','SCAO','HSA'].includes(r))){await signOut(state.auth);throw Error('บัญชี Council ถูกระงับหรือไม่มีสิทธิ์')}
  return {user:cred.user,member:m,profile:profileSnap.exists()?{id:profileSnap.id,...profileSnap.data()}:null};
 }

 if(!profileSnap.exists()){await signOut(state.auth);throw Error('ไม่พบบัญชีผู้ใช้ที่เปิดใช้งานใน TUPP Homework AI')}
 const profile={id:profileSnap.id,...profileSnap.data()};
 if(profile.role==='teacher_pending'){await signOut(state.auth);throw Error('บัญชีครูอยู่ระหว่างรออนุมัติจากผู้ดูแล')}
 if(!['student','teacher'].includes(profile.role)){await signOut(state.auth);throw Error('บัญชีนี้ยังไม่มีสิทธิ์ใช้งาน')}
 return {user:cred.user,profile,member:null};
}
async function adminApi(action,payload={},bootstrapSecret=''){

}

 if(isAdminGoogle(email))throw Error('บัญชีแอดมินนี้ยังไม่มีเอกสารใน councilMembers — เพิ่มเอกสาร councilMembers/'+uid+' (active:true, roles:["CAO"]) ใน Firestore ก่อน');
 if(requireCouncil)throw Error('บัญชีนี้ไม่มีสิทธิ์ Council / Admin');
 if(!ps.exists())throw Error('ยังไม่ได้ลงทะเบียน — ไปที่แท็บลงทะเบียน กรอกรหัส 5 หลัก แล้วกด "ลงทะเบียนด้วย Google"');
 const profile={id:ps.id,...ps.data()};
 if(profile.role==='teacher_pending')throw Error('บัญชีครูอยู่ระหว่างรออนุมัติจากผู้ดูแล');
 if(!['student','teacher'].includes(profile.role))throw Error('บัญชีนี้ยังไม่มีสิทธิ์ใช้งาน');
 return {user:cred.user,profile,member:null,relogin:true};

async function googleRegister({role,id,displayName}){
 if(role!=='student'&&role!=='teacher')throw Error('การลงทะเบียนด้วย Google ใช้ได้เฉพาะนักเรียนและครู');
 if(!/^\d{5}$/.test(id))throw Error('กรอกรหัส 5 หลักในช่องด้านบนก่อน แล้วค่อยกดปุ่ม Google');
 if(role==='teacher'&&String(displayName||'').trim().split(/\s+/).length<2)throw Error('กรอกชื่อและนามสกุลครูก่อน แล้วค่อยกดปุ่ม Google');
 const cred=await googleAuth();const email=String(cred.user.email||'').toLowerCase();
 if(!isTuppEmail(email)){await signOut(state.auth);throw Error('แอดมินไม่ต้องลงทะเบียน ใช้แท็บ CRT-AI / OCAO');}
 const fail=async e=>{if(cred._isNew){try{await deleteUser(cred.user)}catch{}}try{await signOut(state.auth)}catch{}throw e};
 if(role!=='student'&&role!=='teacher')return fail(Error('การลงทะเบียนด้วย Google ใช้ได้เฉพาะนักเรียนและครู'));
 if(!/^\d{5}$/.test(id))return fail(Error('รหัสต้องเป็นตัวเลข 5 หลัก'));
 let first='',last='';
 if(role==='teacher'){const p=String(displayName||'').trim().split(/\s+/);first=p.shift()||'';last=p.join(' ');if(!first||!last)return fail(Error('กรุณากรอกชื่อและนามสกุลครูให้ครบ'))}
 const col=role==='student'?'studentIds':'teacherIds';
 const profile=role==='student'?{uid:cred.user.uid,email,role:'student',studentId:id}:{uid:cred.user.uid,email,role:'teacher_pending',teacherId:id,firstName:first,lastName:last};
 try{await retry(()=>runTransaction(state.db,async tx=>{
  const pr=doc(state.db,'profiles',cred.user.uid);if((await tx.get(pr)).exists())throw Error('บัญชีนี้ลงทะเบียนไว้แล้ว — ใช้ปุ่มเข้าสู่ระบบด้วย Google');
  const idRef=doc(state.db,col,id);if((await tx.get(idRef)).exists())throw Error('รหัสนี้ถูกใช้ลงทะเบียนแล้ว');
  tx.set(idRef,{uid:cred.user.uid,createdAt:serverTimestamp()});
  tx.set(pr,{...profile,createdAt:serverTimestamp(),updatedAt:serverTimestamp()})}))}
 catch(e){return fail(e)}
 return {user:cred.user,profile,member:null};
}
async function listPendingTeachers(){await initFirebase();const snap=await retry(()=>getDocs(query(collection(state.db,'profiles'),where('role','==','teacher_pending'),limit(100))));return snap.docs.map(d=>({id:d.id,...d.data()}))}

/select></label><label>วันและเวลาที่พบ<input id="issueWhen" type="datetime-local" required/></label></div><label>รายละเอียด / ขั้นตอนที่ทำให้เกิดปัญหา<textarea id="issueDetails" required maxlength="4000" placeholder="เกิดอะไรขึ้น เห็นข้อความใด และลองทำขั้นตอนใดแล้ว (อย่าใส่รหัสผ่านหรือข้อมูลลับ) "></textarea></label><label>ความคิดเห็นเพิ่มเติม (ไม่บังคับ)<textarea id="issueComments" maxlength="2500" placeholder="ข้อมูลอื่นที่จำเป็นต่อการตรวจสอบ"></textarea></label><label>ส่งถึง<select id="issueRecipient"><option value="ocao">OCAO / ผู้ดูแลโครงการ</option><option value="owners">เจ้าของโครงการ 4 บัญชี</option></select></label><label style="display:flex;gap:10px;align-items:flex-start;font-weight:600"><input id="issuePrivacyAck" type="checkbox" required style="width:auto;margin:3px 0 0"/>ฉันตรวจสอบแล้วว่าไม่ได้ใส่รหัสผ่าน ข้อมูลสุขภาพ เลขประจำตัวประชาชน หรือข้อมูลของผู้อื่นที่ไม่จำเป็น</label><button class="primary full">ส่งรายงานและสร้างหมายเลขติดตาม</button><div class="form-msg" id="issueMsg" role="status"></div></form><div class="panel"><h3>ติดตามสถานะรายงาน</h3><form id="issueTrackForm"><label>หมายเลขรายงาน<input id="issueTrackId" required placeholder="เช่น CRT-..." value="${esc(app.issueQuery)}"/></label><button class="gold full">ค้นหาสถานะ</button></form><div id="issueTrackResult" class="note" aria-live="polite">${app.issueStatusResult?esc(app.issueStatusResult):'เมื่อส่งรายงานสำเร็จ ระบบจะแสดงหมายเลขอ้างอิงและบันทึกไว้ในอุปกรณ์นี้'}</div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>รายงานล่าสุดบนอุปกรณ์นี้</h3>${recent.map(x=>`<div class="registry"><b>${esc(x.ticket)} · ${esc(x.title)}</b><span>${esc(x.status)} • ${esc(x.createdLocal)}</span></div>`).join('')||'<div class="empty">ยังไม่มีรายงานที่บันทึกไว้บนอุปกรณ์นี้</div>'}<div class="note">การบันทึกในอุปกรณ์นี้ไม่เท่ากับการรับเรื่องจากผู้ดูแล ระบบ Firebase จะบันทึกส่วนกลางได้เมื่อมีการตั้งค่าและกฎอนุญาตแล้ว</div></div></div><div class="panel" style="margin-top:18px"><h3>ช่องแจ้งเตือน — สถานีรายงานข้อผิดพลาด (ภาษาไทย)</h3><p>โปรดเก็บหมายเลขรายงานไว้ ระบบจะแสดงข้อความยืนยันเมื่อบันทึกได้ หากพบเหตุที่เกี่ยวข้องกับความปลอดภัยหรือข้อมูลส่วนบุคคล ให้หลีกเลี่ยงการส่งข้อมูลอ่อนไหวเพิ่ม และส่งเฉพาะรายละเอียดที่จำเป็น</p><div class="note">ผู้รับเรื่องตามที่เลือก: OCAO / เจ้าของโครงการ 4 บัญชี — ${OWNER_EMAILS.map(esc).join(' • ')}</div></div></section>`}
function legalPage(){return `<section class="page"><div class="section-head"><div><span class="eyebrow">CRT-AI • PRIVACY & LEGAL</span><h2>กฎหมายและการคุ้มครองข้อมูล</h2><p>เอกสารประกอบสำหรับโครงการ TUPP Homework AI โดยสรุปหลักกฎหมายที่เกี่ยวข้องและแนวทางใช้งานอย่างรับผิดชอบ</p></div><button class="ghost" data-page="school">← กลับหน้าหลัก</button></div><div class="panel legal"><h3>ประกาศสำคัญก่อนใช้งาน</h3><p><b>สถานะของเอกสาร:</b> ข้อความนี้เป็นข้อมูลทั่วไปเพื่อช่วยให้เข้าใจประเด็นกฎหมาย ไม่ใช่คำปรึกษากฎหมาย ไม่ใช่ประกาศความเป็นส่วนตัวฉบับที่ผ่านการรับรองจากโรงเรียน และไม่ได้หมายความว่า CRT-AI เป็นหน่วยงานราชการหรือผู้ควบคุมข้อมูลของโรงเรียนโดยอัตโนมัติ ผู้จัดทำระบบต้องระบุผู้ควบคุมข้อมูล ผู้ประมวลผล ช่องทางติดต่อ วัตถุประสงค์ ฐานกฎหมาย และระยะเวลาเก็บรักษาที่แท้จริงก่อนเปิดใช้งานจริง</p><h3>1. พระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562 (PDPA)</h3><p>ข้อมูลส่วนบุคคลคือข้อมูลที่ทำให้ระบุตัวบุคคลได้ไม่ว่าทางตรงหรือทางอ้อม รหัสนักเรียน ชื่อ ห้องเรียน ประวัติการส่งงาน บันทึกการใช้งาน หมายเลขรายงานปัญหา และข้อมูลบัญชีอาจเป็นข้อมูลส่วนบุคคลเมื่อเชื่อมโยงถึงบุคคลได้ การนำข้อมูลเหล่านี้มาเก็บ ใช้ เปิดเผย หรือส่งต่อจึงควรทำอย่างมีวัตถุประสงค์ชัดเจน จำกัดเท่าที่จำเป็น และแจ้งให้ผู้ใช้ทราบอย่างโปร่งใส</p><p>มาตรา 22 วางหลักให้เก็บข้อมูลเท่าที่จำเป็นต่อวัตถุประสงค์ที่ชอบด้วยกฎหมาย ส่วนมาตรา 23 กล่าวถึงการแจ้งรายละเอียดก่อนหรือขณะเก็บข้อมูล เช่น วัตถุประสงค์ ประเภทข้อมูล ระยะเวลาเก็บ ผู้รับข้อมูล ช่องทางติดต่อ และสิทธิของเจ้าของข้อมูล ในกรณีที่กฎหมายกำหนด ข้อมูลไม่ควรถูกเก็บเพียงเพราะระบบทำได้ และไม่ควรใช้ข้อมูลที่รวบรวมเพื่อการติดตามการบ้านไปทำวัตถุประสงค์อื่นโดยไม่ตรวจสอบฐานกฎหมายและหน้าที่แจ้งข้อมูลให้เหมาะสม</p><p>การประมวลผลข้อมูลต้องมีฐานทางกฎหมายที่ถูกต้องตามสถานการณ์ ไม่ใช่ทุกกรณีต้องใช้ความยินยอม และไม่ใช่การกดปุ่มยอมรับครั้งเดียวจะทำให้การใช้ข้อมูลทุกอย่างชอบด้วยกฎหมาย ผู้รับผิดชอบควรพิจารณาว่าจำเป็นต่อสัญญา ภารกิจเพื่อประโยชน์สาธารณะ ประโยชน์โดยชอบด้วยกฎหมาย หรือฐานอื่นที่กฎหมายกำหนดหรือไม่ โดยคำนึงถึงอายุและสถานะของผู้ใช้ หากเป็นผู้เยาว์ต้องพิจารณาหลักเกณฑ์เรื่องความสามารถและความยินยอมที่เกี่ยวข้องเป็นพิเศษ</p><p>ข้อมูลส่วนบุคคลที่มีความอ่อนไหวตามมาตรา 26 เช่น ข้อมูลสุขภาพ ความพิการ ชีวมิติ ความเชื่อ ศาสนา หรือข้อมูลอื่นตามที่กฎหมายระบุ ต้องได้รับการดูแลเข้มงวดเป็นพิเศษ ไม่ควรให้แบบฟอร์มรายงานปัญหาขอข้อมูลดังกล่าวหากไม่จำเป็นอย่างยิ่ง ห้ามส่งรหัสผ่าน โทเคนเข้าระบบ ข้อมูลทางการเงิน หรือข้อมูลส่วนตัวของบุคคลอื่นในช่องความคิดเห็น</p><h3>2. สิทธิของเจ้าของข้อมูล</h3><p>ภายใต้เงื่อนไขและข้อยกเว้นของกฎหมาย เจ้าของข้อมูลอาจมีสิทธิขอเข้าถึงหรือรับสำเนาข้อมูล ขอรับข้อมูลในรูปแบบที่กฎหมายกำหนด คัดค้านการประมวลผล ขอให้ลบ ทำลาย หรือทำให้ไม่สามารถระบุตัวบุคคล ขอให้ระงับการใช้ ขอแก้ไขข้อมูลให้ถูกต้อง และร้องเรียนต่อหน่วยงานที่มีอำนาจ การใช้สิทธิต้องตรวจสอบตัวตนอย่างเหมาะสมและไม่เปิดเผยข้อมูลของบุคคลอื่น การลบข้อมูลอาจมีข้อยกเว้นตามกฎหมายหรือหน้าที่การเก็บรักษา</p><p>ระบบที่ใช้งานจริงควรมีช่องทางขอใช้สิทธิและผู้รับผิดชอบที่ระบุชัดเจน พร้อมกระบวนการยืนยันคำขอ บันทึกการดำเนินการ และตอบกลับภายในระยะเวลาตามกฎหมายที่เกี่ยวข้อง อย่าใส่ที่อยู่อีเมลส่วนตัวของผู้ดูแลเป็นช่องทางอย่างเป็นทางการจนกว่าจะได้รับอนุญาตและกำหนดผู้รับผิดชอบจริง</p><h3>3. ความมั่นคงปลอดภัยและเหตุละเมิดข้อมูล</h3><p>ผู้รับผิดชอบระบบควรใช้มาตรการที่เหมาะสมเพื่อป้องกันการเข้าถึง แก้ไข เปิดเผย สูญหาย หรือทำลายข้อมูลโดยไม่ได้รับอนุญาต เช่น จำกัดสิทธิ์ตามบทบาท ตรวจสอบสิทธิ์ฝั่งเซิร์ฟเวอร์ ใช้การเชื่อมต่อเข้ารหัส ไม่เปิดฐานข้อมูลสาธารณะ จัดการรหัสผ่านผ่านระบบยืนยันตัวตนที่ได้มาตรฐาน บันทึกเหตุการณ์เท่าที่จำเป็น ทบทวนบัญชีผู้ดูแล และมีแผนรับมือเหตุการณ์</p><p>เมื่อสงสัยว่าเกิดเหตุละเมิดข้อมูล ต้องจำกัดความเสียหาย เก็บหลักฐานที่จำเป็น แจ้งผู้รับผิดชอบความปลอดภัย และประเมินหน้าที่แจ้งสำนักงานคณะกรรมการคุ้มครองข้อมูลส่วนบุคคลและเจ้าของข้อมูลตามเงื่อนไขและกรอบเวลาที่กฎหมายกำหนด โดยมาตรา 37 มีหน้าที่บางประการเกี่ยวกับมาตรการความปลอดภัยและการแจ้งเหตุละเมิด การตัดสินใจต้องอิงข้อเท็จจริงและคำแนะนำของผู้รับผิดชอบ ไม่ควรสรุปเองว่าเหตุเล็กน้อยจึงไม่ต้องดำเนินการ</p><h3>4. การเก็บรักษา การเปิดเผย และผู้ให้บริการภายนอก</h3><p>ก่อนใช้ Firebase, NVIDIA NIM หรือบริการคลาวด์อื่นจริง ต้องตรวจสอบข้อกำหนดผู้ให้บริการ สถานที่จัดเก็บและการโอนข้อมูลระหว่างประเทศ บทบาทของผู้ให้บริการ ข้อตกลงประมวลผลข้อมูล การตั้งค่าการเก็บ log และการใช้ข้อมูลเพื่อปรับปรุงบริการ ไม่ควรส่งข้อมูลระบุตัวนักเรียนหรือข้อมูลการเรียนที่ระบุตัวบุคคลได้ให้ AI หากไม่จำเป็นและไม่ได้ผ่านการพิจารณาฐานกฎหมายและมาตรการที่เหมาะสม ควรใช้ข้อมูลสมมติหรือลบข้อมูลระบุตัวบุคคลออกก่อนทดสอบ</p><p>กำหนดอายุข้อมูลตามวัตถุประสงค์ เช่น ระยะเวลาเก็บรายงานปัญหา ระยะเวลาเก็บบันทึกความปลอดภัย และกระบวนการลบหรือทำให้ไม่สามารถระบุตัวบุคคลได้เมื่อหมดความจำเป็น การเก็บข้อมูลไม่มีกำหนดเพียงเพื่อความสะดวกเพิ่มความเสี่ยงและไม่สอดคล้องกับหลักเก็บเท่าที่จำเป็น</p><h3>5. พระราชบัญญัติว่าด้วยการกระทำความผิดเกี่ยวกับคอมพิวเตอร์ และการใช้งานอย่างสุจริต</h3><p>ผู้ใช้ควรเข้าถึงเฉพาะบัญชีและข้อมูลที่ตนได้รับอนุญาต ไม่ทดลองเจาะระบบ ไม่เปลี่ยนแปลงข้อมูลของผู้อื่น ไม่เผยแพร่ข้อมูลเท็จหรือข้อมูลส่วนตัวโดยไม่ชอบ และไม่ใช้ระบบรายงานปัญหาเพื่อกลั่นแกล้ง คุกคาม หรือส่งเนื้อหาที่ผิดกฎหมาย การประเมินว่าเหตุใดเข้าข่ายความผิดหรือไม่ต้องดูองค์ประกอบกฎหมายและข้อเท็จจริงเป็นรายกรณี ข้อความนี้ไม่ได้กล่าวหาว่าการกระทำใดเป็นความผิดโดยอัตโนมัติ</p><h3>6. แนวปฏิบัติสำหรับนักเรียนและครู</h3><ul><li>ตั้งรหัสผ่านที่คาดเดายากและไม่ใช้ซ้ำกับบัญชีอื่น</li><li>ไม่เปิดเผยรหัสผ่านให้เพื่อน ครู หรือผู้รับรายงาน และไม่ใส่รหัสผ่านลงในช่องรายงานปัญหา</li><li>ครูควรเปิดดูเฉพาะข้อมูลนักเรียนที่จำเป็นต่อหน้าที่ และไม่ส่งออกหรือเผยแพร่รายการคะแนน/การบ้านในที่สาธารณะ</li><li>นักเรียนควรส่งรายงานที่สุภาพ เป็นข้อเท็จจริง และไม่แนบข้อมูลของบุคคลอื่นโดยไม่จำเป็น</li><li>หากเห็นข้อมูลที่ไม่ควรเข้าถึง ให้หยุดเปิดดูและแจ้งผู้ดูแลผ่านช่องทางที่กำหนด ไม่ควรดาวน์โหลดหรือแชร์ต่อ</li><li>ผู้ดูแลควรตรวจสิทธิ์บัญชีและกฎฐานข้อมูลเป็นระยะ รวมถึงทบทวนการเข้าถึงของผู้ที่พ้นหน้าที่</li></ul><h3>7. ขอบเขตความรับผิดชอบของ CRT-AI</h3><p>สถานีนี้จัดทำเป็นส่วนหนึ่งของโครงการ TUPP Homework AI โดยใช้ชื่อ CRT-AI เพื่อระบุกรอบโครงการด้านการกำกับดูแล การวิจัย เทคโนโลยี และปัญญาประดิษฐ์เท่านั้น การแสดงชื่อ CRT-AI ไม่ได้เป็นการยืนยันว่าเป็นหน่วยงานราชการ หน่วยงานของโรงเรียน หรือได้รับการแต่งตั้งอย่างเป็นทางการ การอนุมัติใช้งานจริง การกำหนดผู้ควบคุมข้อมูล และการติดต่อหน่วยงานโรงเรียนต้องดำเนินการโดยผู้มีอำนาจตามจริง</p><h3>8. สิ่งที่ต้องทำก่อนเปิดใช้จริง</h3><ol><li>จัดทำ Privacy Notice ที่ระบุผู้ควบคุมข้อมูล ช่องทางติดต่อ ฐานกฎหมาย วัตถุประสงค์ ระยะเวลาเก็บ และผู้รับข้อมูลจริง</li><li>ตั้ง Firebase Authentication และ Firestore Security Rules โดยปฏิเสธการเข้าถึงเป็นค่าเริ่มต้น และตรวจสิทธิ์ในฝั่งเซิร์ฟเวอร์</li><li>ไม่ใช้รหัสนักเรียน 5 หลักเป็นข้อมูลลับเพียงอย่างเดียว เพราะมีจำนวนความเป็นไปได้จำกัด ต้องมีรหัสผ่านและมาตรการป้องกันการเดารหัส</li><li>กำหนดขั้นตอนการกู้คืนบัญชี การปิดบัญชี การลบข้อมูล และการจัดการเหตุละเมิด</li><li>ตรวจสอบการใช้บริการ AI และผู้ให้บริการภายนอกก่อนส่งข้อมูลจริง</li><li>ให้ผู้รับผิดชอบด้านกฎหมาย/ข้อมูลส่วนบุคคลตรวจทานก่อนเผยแพร่</li></ol><div class="note">แหล่งอ้างอิงทางการสำหรับอ่านกฎหมายฉบับเต็ม: กรมที่ดิน/หน้ารวม PDPA, สำนักงานคณะกรรมการกฤษฎีกาหรือราชกิจจานุเบกษา และกระทรวงดิจิทัลเพื่อเศรษฐกิจและสังคม โปรดตรวจฉบับและกฎลำดับรองล่าสุดก่อนใช้งานจริง</div><p>แหล่งอ่านเพิ่มเติม: <a href="https://www.dol.go.th/pdpa/new-home/" target="_blank" rel="noreferrer">หน้ารวมกฎหมาย PDPA</a> · <a href="https://law.prd.go.th/th/content/category/detail/id/2475/iid/234607" target="_blank" rel="noreferrer">พระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562</a> · <a href="https://www.mdes.go.th/law/128" target="_blank" rel="noreferrer">กฎหมายว่าด้วยการกระทำความผิดเกี่ยวกับคอมพิวเตอร์</a></p></div></section>`}
shell = function(){const adminAllowed=Boolean(app.member&&app.member.active!==false);const pages={school:school(),tracking:tracking(),ai:ai(),admin:adminAllowed?admin():school(),account:accountPage(),issues:issuesPage(),legal:legalPage()};document.getElementById('root').innerHTML=`<div class="app"><header class="top"><div class="brand"><div class="logo"><canvas data-electric></canvas></div><div><div class="brand-title">TUPP HOMEWORK AI</div><div class="brand-sub">ต.อ.พ.ภ. • CRT-AI Project Operations</div></div></div><div class="top-actions"><span class="status-dot ${state.fb.booted?'ok':''}"></span><span class="tiny">FIREBASE ${state.fb.booted?'READY':'NOT CONFIGURED'}</span><button class="admin-entry" id="openCouncil">COUNCIL / ADMIN</button>${app.session?'<button class="ghost" id="logout">ออกจากระบบ</button>':''}</div></header><nav class="nav"><button class="${app.page==='school'?'active':''}" data-page="school"><b>01</b><span>หน้าหลัก</span></button><button class="${app.page==='tracking'?'active':''}" data-page="tracking"><b>02</b><span>บันทึกงานกันลืม / ติดตามงาน</span></button><button class="${app.page==='ai'?'active':''}" data-page="ai"><b>03</b><span>Homework AI</span></button><button class="${app.page==='account'?'active':''}" data-page="account"><b>04</b><span>สมัคร / เข้าสู่ระบบ</span></button><button class="${app.page==='issues'?'active':''}" data-page="issues"><b>05</b><span>รายงานปัญหา</span></button><button class="${app.page==='legal'?'active':''}" data-page="legal"><b>06</b><span>กฎหมาย / ความเป็นส่วนตัว</span></button><button class="${app.page==='admin'?'active':''}" data-page="admin"><b>CRT-AI</b><span>ศูนย์ควบคุม</span></button></nav><main>${pages[app.page]||school()}</main><div class="footer">TUPP Homework AI • CRT-AI Education Workspace • ระบบต้นแบบอิสระ ไม่ใช่บริการทางการของโรงเรียนหรือ NVIDIA</div>${app.authOpen?authModal():''}</div>`;wire();drawLogos()};

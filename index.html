function explainFirebaseError(err){
 const code=String(err?.code||'');
 const map={
  'auth/invalid-credential':'อีเมลหรือรหัสผ่านไม่ถูกต้อง หรือผู้ให้บริการ Email/Password ยังไม่เปิดใน Firebase Authentication',

  'auth/email-already-in-use':'อีเมลนี้มีบัญชีอยู่แล้ว ให้เข้าสู่ระบบแทน',

  'permission-denied':'Firestore ปฏิเสธการเข้าถึง ตรวจ Firestore Security Rules และสิทธิ์ของบัญชี',
  'unavailable':'Firebase/Firestore ยังไม่พร้อมใช้งานชั่วคราว กรุณาลองใหม่',
  'failed-precondition':'Firestore ต้องตั้งค่าดัชนีหรือเปิดใช้งานฐานข้อมูลตามที่คำขอต้องการ',

 };
 return map[code] || err?.message || 'เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ';
}
async function initFirebase(){
 await loadRuntimeFirebaseConfig();
 if(state.fb.booted && state.app && state.auth && state.db)return;
 if(!firebaseConfigured())throw Error('Firebase config ไม่ครบ: ต้องมี apiKey, authDomain, projectId และ appId');
 const appName='tupp-homework-ai-'+String(firebaseConfig.projectId).replace(/[^a-zA-Z0-9-]/g,'-');
 state.app=getApps().find(a=>a.name===appName) || initializeApp(firebaseConfig,appName);
 state.auth=getAuth(state.app);state.db=getFirestore(state.app);googleProvider = new GoogleAuthProvider(); googleProvider.setCustomParameters({ 'hd': 'tupp.ac.th' });
 try{await enableMultiTabIndexedDbPersistence(state.db);state.fb.persistence='enabled'}catch(e){state.fb.persistence=(e?.code==='failed-precondition'?'another-tab-active':'memory/cache unavailable')}
 state.fb.booted=true;state.fb.configured=true;state.fb.lastSuccessAt=Date.now();state.fb.lastError='';render();
}
async function retry(fn,tries=4){let last;const permanentCodes=['permission-denied','unauthenticated','invalid-argument','already-exists','not-found','failed-precondition','auth/invalid-credential','auth/invalid-login-credentials','auth/user-not-found','auth/wrong-password','auth/email-already-in-use','auth/weak-password','auth/invalid-email','auth/operation-not-allowed','auth/unauthorized-domain'];for(let i=0;i<tries;i++){try{const v=await fn();if(i)state.fb.retryCount++;state.fb.lastSuccessAt=Date.now();state.fb.lastError='';return v}catch(e){last=e;state.fb.lastError=explainFirebaseError(e);if(permanentCodes.includes(e?.code)||i===tries-1)break;await new Promise(r=>setTimeout(r,400*Math.pow(2,i)))}}throw last}
async function councilLogin(email,password){
 await initFirebase();
 const cred=await retry(()=>signInWithEmailAndPassword(state.auth,email.trim().toLowerCase(),password));

 if(!snap.exists()){await signOut(state.auth);throw Error('บัญชีนี้ไม่มีสิทธิ์ Council / Admin')}
 const m={id:snap.id,...snap.data()};
 if(m.active!==true||!Array.isArray(m.roles)||!m.roles.some(r=>['CAO','ADMIN','DCAO','SCAO','HSA'].includes(r))){await signOut(state.auth);throw Error('บัญชี Council ถูกระงับหรือยังไม่ได้รับสิทธิ์')}

}

async function sendAI(){
 if(app.busy)return;const input=document.getElementById('aiInput');const q=(input?.value||'').trim();if(!q)return;
 const user=state.auth?.currentUser;if(!user){app.status='กรุณาเข้าสู่ระบบด้วยบัญชีที่ได้รับอนุมัติก่อนใช้ NVIDIA AI';app.messages.push({role:'model',text:'กรุณาเข้าสู่ระบบด้วยบัญชีที่ได้รับอนุมัติก่อนใช้งาน AI'});render();return}
 app.messages.push({role:'user',text:q});app.busy=true;render();
 try{
  const payload = {
    model: app.selectedModel,
    messages: app.messages.map(m=>({role:m.role==='user'?'user':'assistant',content:m.text})),
    max_tokens: 65536,
    reasoning_budget: 16384,
    stream: false,
    temperature: 0.6,
    top_p: 0.95
  };
  const r = await fetch(app.nvidiaEndpoint,{ // endpoint now points to proxy
    method:'POST',
    headers:{
      'Content-Type':'application/json'
      // Authorization header removed – Nginx proxy adds it from $NVIDIA_API_KEY
    },
    body:JSON.stringify(payload)
  });
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw Error(d.error || `NVIDIA NIM request failed (${r.status})`);
  app.messages.push({role:'model',text:(d.text||'NVIDIA NIM ไม่ได้ส่งข้อความตอบกลับ')+`\n\n[${d.model||app.selectedModel} • ${app.aiMode}]`});
 }
 catch(e){app.messages.push({role:'model',text:`เชื่อมต่อ NVIDIA NIM ไม่สำเร็จ: ${e.message}. ตรวจสอบว่าโฮสต์มี /api/nvidia, ตั้งค่า NVIDIA_API_KEY ฝั่งเซิร์ฟเวอร์ และบัญชีมีสิทธิ์ใช้งานโมเดลที่เลือก`})}
 finally{app.busy=false;render();setTimeout(()=>document.getElementById('chatLog')?.scrollTo({top:999999,behavior:'smooth'}),20)}
}
</script>

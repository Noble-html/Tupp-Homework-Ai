row{grid-template-columns:repeat(2,1fr)}.class-row{grid-template-columns:1fr 1fr}.section-head{align-items:start;flex-direction:column}}@media(max-width:640px){.top{padding:11px 13px}.brand-sub,.top-actions .tiny{display:none}.page{padding:22px 13px 50px}.hero{padding:28px;border-radius:22px}.hero h1{font-size:44px}.cards{gap:10px}.two{grid-template-columns:1fr}.task{align-items:flex-start;flex-direction:column}.task-right{text-align:left}.nav{padding:10px 13px}.section-head h2{font-size:38px}}

:11px;line-height:1.7;color:#667085;background:#f6f8fc;border-radius:12px;padding:11px;margin-top:12px}.gate-config{display:none;margin-top:12px;padding:12px;background:#f6f8fc;border-radius:14px}.gate-config.open{display:block}.gate-config textarea{width:100%;min-height:110px;border:1px solid #dce2ec;border-radius:10px;padding:10px}.gate-secondary{background:#eef2f8!important;color:#1e293b!important}.gate-footer{font-size:11px;color:#8b96a8;line-height:1.6;margin-top:16px}@media(max-width:760px){#secureEntryGate{align-items:flex-start;padding:12px}.gate-shell{grid-template-columns:1fr;max-width:540px}.gate-intro{min-height:0;padding:22px}.gate-intro h1{font-size:36px;margin:18px 0 10px}.gate-intro .gate-extra{display:none}.gate-panel{padding:18px}.gate-form .gate-two{grid-template-columns:1fr}}

<div id="root"></div>
<script type="module">
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInAnonymously, signOut } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
import { getFirestore, doc, getDoc, addDoc, setDoc, collection, query, where, orderBy, limit, onSnapshot, serverTimestamp, enableMultiTabIndexedDbPersistence } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';

const LEGACY_COUNCIL_REGISTRY=[
 {email:'rachata.le@gmail.com',roles:['CAO','AOC'],access:['OAS-0','018-S']},
 {email:'06554@tupp.ac.th',roles:['DCAO','AOC'],access:['OS-1 FIELD','018']},
 {email:'thanawinnoble07@gmail.com',roles:['SCAO','HSA'],access:['OS-1','010-S']},
 {email:'06546@tupp.ac.th',roles:['SCAO','HSA'],access:['SO-1','LEGACY-S']}
];
const state={app:null,auth:null,db:null,fb:{configured:false,booted:false,persistence:'not-initialized',retryCount:0,lastError:'',lastSuccessAt:null,activeListeners:0},listeners:new Set()};
const cfgKey='tupp_ai_v43_firebase_config';
let firebaseConfig={...JSON.parse(localStorage.getItem(cfgKey)||'{}')};
function saveCfg(){localStorage.setItem(cfgKey,JSON.stringify(firebaseConfig));}
function firebaseConfigured(){return Boolean(firebaseConfig.apiKey&&firebaseConfig.authDomain&&firebaseConfig.projectId&&firebaseConfig.appId)}
async function initFirebase(){
 if(state.fb.booted)return;
 if(!firebaseConfigured())throw Error('ยังไม่ได้ตั้งค่า Firebase');
 state.app=getApps().length?getApps()[0]:initializeApp(firebaseConfig);state.auth=getAuth(state.app);state.db=getFirestore(state.app);
 try{await enableMultiTabIndexedDbPersistence(state.db);state.fb.persistence='enabled'}catch{state.fb.persistence='unavailable'}
 state.fb.booted=true;state.fb.configured=true;state.fb.lastSuccessAt=Date.now();render();
}
async function retry(fn,tries=5){let last;for(let i=0;i<tries;i++){try{const v=await fn();if(i)state.fb.retryCount++;state.fb.lastSuccessAt=Date.now();state.fb.lastError='';return v}catch(e){last=e;state.fb.lastError=e.message;if(i<tries-1)await new Promise(r=>setTimeout(r,500*Math.pow(2,i)))}}throw last}
async function councilLogin(email,password){await initFirebase();const cred=await retry(()=>signInWithEmailAndPassword(state.auth,email.trim().toLowerCase(),password));const s=await retry(()=>getDoc(doc(state.db,'councilMembers',cred.user.uid)));if(!s.exists()){await signOut(state.auth);throw Error('บัญชี Firebase นี้ยังไม่ได้ลงทะเบียนใน Council Directory')}const m=s.data();if(m.active===false){await signOut(state.auth);throw Error('บัญชี Council ถูกระงับ')}return {user:cred.user,member:m}}
async function generalLogin(){await initFirebase();return retry(()=>signInAnonymously(state.auth))}
async function audit(event,payload={}){if(!state.db||!state.auth?.currentUser)return;return retry(()=>addDoc(collection(state.db,'audit'),{event,payload,actorUid:state.auth.currentUser.uid,createdAt:serverTimestamp()}))}
async function listHomework(studentId){await initFirebase();const q=query(collection(state.db,'homework'),where('studentId','==',studentId),orderBy('dueAt','asc'),limit(200));return new Promise((resolve,reject)=>{const stop=onSnapshot(q,s=>{state.fb.lastSuccessAt=Date.now();resolve(s.docs.map(d=>({id:d.id,...d.data()})))},e=>{state.fb.lastError=e.message;reject(e)});state.listeners.add(stop);state.fb.activeListeners=state.listeners.size})}
async function addHomework(data){await initFirebase();return retry(()=>addDoc(collection(state.db,'homework'),{...data,createdAt:serverTimestamp(),updatedAt:serverTimestamp()}))}
async function listClass(classRoom){await initFirebase();const q=query(collection(state.db,'homework'),where('classRoom','==',classRoom),orderBy('dueAt','asc'),limit(500));return new Promise((resolve,reject)=>{const stop=onSnapshot(q,s=>resolve(s.docs.map(d=>({id:d.id,...d.data()}))),reject);state.listeners.add(stop);state.fb.activeListeners=state.listeners.size})}
async function health(){await initFirebase();const t=performance.now();const s=await retry(()=>getDoc(doc(state.db,'system','health')));return{latency:Math.round(performance.now()-t),healthDocument:s.exists()}}

const app={page:'school',session:null,member:null,authMode:'general',authOpen:false,status:'',tasks:[],classTasks:[],studentId:'',messages:[{role:'model',text:'สวัสดีครับ ผม TUPP Homework AI ถามได้ทั้งเรื่องการเรียน การบ้าน วิทยาศาสตร์ คณิตศาสตร์ ภาษา หรือคำถามทั่วไป'}],busy:false,form:{title:'',subject:'',dueAt:'',priority:'NORMAL',scoreMax:'10',note:''},classRoom:'',geminiEndpoint:'/api/gemini'};
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function setStatus(s){app.status=s;render()}
function nav(k){app.page=k;window.scrollTo({top:0,behavior:'smooth'});render()}

function tracking(){const now=Date.now();const pending=app.tasks.filter(x=>x.status==='PENDING');return `<section class="page"><div class="section-head"><div><span class="eyebrow">HOMEWORK TRACKING</span><h2>ติดตามงาน</h2><p>หน้าเดียวสำหรับบันทึกงาน ดู Deadline และแยกสถานะส่งแล้ว / ยังไม่ส่ง / เลยกำหนด</p></div><div class="tracking-badge">${pending.length} งานค้าง</div></div><div class="tracking-grid"><form class="panel" id="taskForm"><h3>บันทึกการบ้าน</h3><label>รหัสนักเรียน 5 หลัก<input id="studentId" inputmode="numeric" maxlength="5" value="${esc(app.studentId)}" placeholder="5-digit ID"/></label><label>ชื่องาน<input id="title" required value="${esc(app.form.title)}"/></label><label>วิชา<input id="subject" value="${esc(app.form.subject)}"/></label><label>กำหนดส่ง<input id="dueAt" type="datetime-local" value="${esc(app.form.dueAt)}"/></label><div class="two"><label>ความสำคัญ<select id="priority"><option ${app.form.priority==='NORMAL'?'selected':''}>NORMAL</option><option ${app.form.priority==='HIGH'?'selected':''}>HIGH</option><option ${app.form.priority==='URGENT'?'selected':''}>URGENT</option></select></label><label>คะแนนเต็ม<input id="scoreMax" type="number" min="0" value="${esc(app.form.scoreMax)}"/></label></div><label>หมายเหตุ<textarea id="note">${esc(app.form.note)}</textarea></label><button class="primary">บันทึกงานลง Firebase</button><div class="form-msg">${esc(app.status)}</div></form><div class="panel"><div class="panel-head"><div><h3>สถานะงาน</h3><span class="muted">ข้อมูลล่าสุดจาก Firestore</span></div><button class="ghost" id="refreshTasks">รีเฟรช</button></div><div class="stat-row"><div class="stat"><b>${app.tasks.length}</b><span>ทั้งหมด</span></div><div class="stat"><b>${app.tasks.filter(x=>x.status==='SUBMITTED').length}</b><span>ส่งแล้ว</span></div><div class="stat"><b>${pending.length}</b><span>ยังไม่ส่ง</span></div><div class="stat red"><b>${pending.filter(x=>x.dueAt&&new Date(x.dueAt).getTime()<now).length}</b><span>เลยกำหนด</span></div></div title:document.getElementById('title').value,subject:document.getElementById('subject').value,dueAt:document.getElementById('dueAt').value,priority:document.getElementById('priority').value,scoreMax:document.getElementById('scoreMax').value,note:document.getElementById('note').value};try{await addHomework({...app.form,studentId:app.studentId,scoreMax:Number(app.form.scoreMax||0),classRoom:'',status:'PENDING',createdBy:app.session.uid});app.status='บันทึกการบ้านลง Firebase แล้ว';await loadTasks();app.form={title:'',subject:'',dueAt:'',priority:'NORMAL',scoreMax:'10',note:''};render()}catch(x){app.status=x.message;render()}});document.getElementById('refreshTasks')?.addEventListener('click',loadTasks);document.getElementById('sendAI')?.addEventListener('click',sendAI);document.getElementById('aiInput')?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendAI()}});document.getElementById('setEndpoint')?.addEventListener('click',()=>{const v=prompt('Gemini endpoint',app.geminiEndpoint);if(v){app.geminiEndpoint=v;render()}});document.getElementById('systemCheck')?.addEventListener('click',async()=>{try{app.status='กำลังตรวจระบบ…';render();const r=await health();app.status=`Health document: ${r.healthDocument?'FOUND':'NOT FOUND'} • ${r.latency} ms`;render()}catch(e){app.status=e.message;render()}});document.getElementById('saveConfig')?.addEventListener('click',()=>{document.querySelectorAll('[data-cfg]').forEach(i=>firebaseConfig[i.dataset.cfg]=i.value.trim());saveCfg();state.app=state.auth=state.db=null;state.fb={configured:firebaseConfigured(),booted:false,persistence:'not-initialized',retryCount:0,lastError:'',lastSuccessAt:null,activeListeners:0};app.status='บันทึก Config แล้ว — กดรีโหลดหน้าเพื่อเริ่ม Firebase';render()});document.getElementById('loadClass')?.addEventListener('click',async()=>{app.classRoom=document.getElementById('classRoom').value.trim();try{app.classTasks=await listClass(app.classRoom);app.status=`โหลด ${app.class async function sendAI(){if(app.busy)return;const input=document.getElementById('aiInput');const q=(input?.value||'').trim();if(!q)return;app.messages.push({role:'user',text:q});app.busy=true;render();try{const r=await fetch(app.geminiEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:app.messages.map(m=>({role:m.role==='model'?'model':'user',parts:[{text:m.text}]}))})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`Gemini request failed (${r.status})`);app.messages.push({role:'model',text:d.text||'Gemini ไม่ได้ส่งข้อความตอบกลับ'});}catch(e){app.messages.push({role:'model',text:`เชื่อม Gemini ไม่สำเร็จ: ${e.message}`})}finally{app.busy=false;render();setTimeout(()=>document.getElementById('chatLog')?.scrollTo({top:999999,behavior:'smooth'}),20)}}
function drawLogos(){document.querySelectorAll('canvas[data-electric]').forEach(c=>{const ctx=c.getContext('2d');let dpr=devicePixelRatio||1;let raf;function fit(){const r=c.getBoundingClientRect();c.width=r.width*dpr;c.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}fit();let t=0;function frame(){t+=.025;const r=c.getBoundingClientRect(),w=r.width,h=r.height;ctx.clearRect(0,0,w,h);const cx=w/2,cy=h/2,s=Math.min(w,h);for(let k=0;k<6;k++){ctx.beginPath();for(let i=0;i<=220;i++){const a=i/220*Math.PI*2;const rr=s*(.25+.07*Math.sin(a*5+t*2+k*.7))+k*.5;const x=cx+Math.cos(a+t*.2+k)*rr;const y=cy+Math.sin(a+t*.2+k)*rr;const g=2.2*Math.sin(a*9+t*3+k)+Math.sin(a*17-t*2);const xx=x+g,yy=y+Math.cos(a*11+t+k)*2; i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.strokeStyle=k%2?'rgba(239,58,151,.33)':'rgba(22,136,255,.45)';ctx.lineWidth=1.3;ctx.stroke()}ctx.beginPath();ctx.arc(cx,cy,s*.22,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;ctx.stroke();raf=requestAnimationFrame(frame)}frame();window.addEventListener('resize',fit,{passive:true});c._electricStop=()=>cancelAnimationFrame(raf)})}

function accountAlias(role,id){return `${role.toLowerCase()}-${id}@accounts.tupp.local`;}
async function registerSchoolAccount(role,id,password,displayName,classRoom){
  if(!/^\d{5}$/.test(id)) throw Error('รหัสนักเรียน/ครูต้องเป็นตัวเลข 5 หลัก');
  if(password.length<8) throw Error('รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร');
  await initFirebase();
  const accountKey=`${role}_${id}`;
  const existing=await retry(()=>getDoc(doc(state.db,'accountIds',accountKey)));
  if(existing.exists()) throw Error('รหัสนี้ลงทะเบียนแล้ว กรุณาเข้าสู่ระบบ');
  const credential=await retry(()=>createUserWithEmailAndPassword(state.auth,accountAlias(role,id),password));
  const profile={uid:credential.user.uid,role,schoolId:id,displayName:displayName.trim(),classRoom:classRoom.trim(),active:true,createdAt:serverTimestamp(),project:'TUPP Homework AI'};
  await retry(()=>setDoc(doc(state.db,'users',credential.user.uid),profile));
  await retry(()=>setDoc(doc(state.db,'accountIds',accountKey),{uid:credential.user.uid,role,schoolId:id,active:true,createdAt:serverTimestamp()}));
  await audit('SCHOOL_ACCOUNT_REGISTER',{role,schoolId:id});
  return {user:credential.user,profile};
}
async function schoolAccountLogin(role,id,password){
  if(!/^\d{5}$/.test(id)) throw Error('รหัสต้องเป็นตัวเลข 5 หลัก');
  await initFirebase();
  const key=`${role}_${id}`;
  const ref=await retry(()=>getDoc(doc(state.db,'accountIds',key)));
  if(!ref.exists()||ref.data().active===false) throw Error('ไม่พบบัญชีหรือบัญชีถูกระงับ');
  const cred=await retry(()=>signInWithEmailAndPassword(state.auth,accountAlias(role,id),password));
  const userSnap=await retry(()=>getDoc(doc(state.db,'users',cred.user.uid)));
  if(!userSnap.exists()){await signOut(state.auth);throw Error('ไม่พบข้อมูลโปรไฟล์ กรุณาติดต่อผู้ดูแลระบบ');}
  const profile=userSnap.data();
  if(profile.active===false){await signOut(state.auth);throw Error('บัญชีถูกระงับ');}
  return {user:cred.user,profile};
}

tracking = function(){const now=Date.now();const pending=app.tasks.filter(x=>x.status==='PENDING');const teacher=app.userProfile?.role==='teacher';return `<section class="page"><div class="section-head"><div><span class="eyebrow">HOMEWORK & REMINDERS</span><h2>บันทึกงานกันลืม / ติดตามงาน</h2><p>นักเรียนใช้จดกำหนดส่งของตนเอง ส่วนคุณครูสามารถมอบหมายงานโดยระบุรหัสนักเรียน 5 หลัก</p></div><button class="ghost" data-page="school">← กลับหน้าหลัก</button></div>${teacher?`<form class="panel" id="teacherTaskForm" style="margin-bottom:18px"><h3>มอบหมายงานสำหรับนักเรียน</h3><div class="two"><label>รหัสนักเรียนเป้าหมาย (5 หลัก)<input id="assignStudentId" required inputmode="numeric" pattern="[0-9]{5}" maxlength="5"/></label><label>ห้องเรียน<input id="assignClass" required placeholder="เช่น ม.1/9"/></label></div><div class="two"><label>ชื่องาน<input id="assignTitle" required maxlength="180"/></label><label>วิชา<input id="assignSubject" maxlength="80"/></label></div><div class="two"><label>กำหนดส่ง<input id="assignDueAt" type="datetime-local" required/></label><label>ความสำคัญ<select id="assignPriority"><option value="NORMAL">ปกติ</option><option value="HIGH">สูง</option><option value="URGENT">เร่งด่วน</option></select></label></div><label>รายละเอียด / คำชี้แจง<textarea id="assignNote" maxlength="2500"></textarea></label><button class="primary">บันทึกและมอบหมายงาน</button><div class="form-msg" id="teacherTaskMsg" role="status"></div></form>`:''}<div class="tracking-grid"><form class="panel" id="taskForm"><h3>บันทึกงานกันลืมส่วนตัว</h3><label>รหัสนักเรียน 5 หลัก<input id="studentId" inputmode="numeric" maxlength="5" value="${esc(app.studentId)}" placeholder="รหัส 5 หลัก"/></label><label>ชื่องาน<input id="title" required value="${esc(app.form.title)}"/></label><label>วิชา<input id="subject" value="${esc(app.form.subject)}"/></label><label>กำหนดส่ง<input id="dueAt" type="datetime-local" value="${esc(app.form.dueAt)}"/></label><div class="two"><label>ความสำคัญ<select id="priority"><option ${app.form.priority==='NORMAL'?'selected':''} value="NORMAL">ปกติ</option><option ${app.form.priority==='HIGH'?'selected':''} value="HIGH">สูง</option><option ${app.form.priority==='URGENT'?'selected':''} value="URGENT">เร่งด่วน</option></select></label><label>คะแนนเต็ม<input id="scoreMax" type="number" min="0" value="${esc(app.form.scoreMax)}"/></label></div><label>หมายเหตุ<textarea id="note">${esc(app.form.note)}</textarea></label><button class="primary">บันทึกงาน</button><div class="form-msg">${esc(app.status)}</div></form><div class="panel"><div class="panel-head"><div><h3>สถานะงาน</h3><span class="muted">งานที่เชื่อมกับรหัสนักเรียน</span></div><button class="ghost" id="refreshTasks">รีเฟรช</button></div><div class="stat-row"><div class="stat"><b>${app.tasks.length}</b><span>ทั้งหมด</span></div><div class="stat"><b>${app.tasks.filter(x=>x.status==='SUBMITTED').length}</b><span>ส่งแล้ว</span></div><div class="stat"><b>${pending.length}</b><span>ยังไม่ส่ง</span></div><div class="stat red"><b>${pending.filter(x=>x.dueAt&&new Date(x.dueAt).getTime()<now).length}</b><span>เลยกำหนด</span></div></div><div class="task-list">${app.tasks.map(t=>{const overdue=t.status==='PENDING'&&t.dueAt&&new Date(t.dueAt).getTime()<now;return `<div class="task ${overdue?'overdue':''}"><div><b>${esc(t.title)}</b><span>${esc(t.subject||'ไม่ระบุวิชา')} • ${esc(t.priority||'NORMAL')} • ${esc(t.classRoom||'งานส่วนตัว')}</span></div><div class="task-right"><span>${t.status==='SUBMITTED'?'ส่งแล้ว':'ยังไม่ส่ง'}</span><small>${esc(t.dueAt||'ไม่ระบุ Deadline')}</small></div></div>`}).join('')||'<div class="empty">ยังไม่มีรายการงานสำหรับรหัสนี้</div>'}</div></div></div></section>`};
function accountPage(){return `<section class="page"><div class="section-head"><div><span class="eyebrow">ACCOUNT CENTER</span><h2>บัญชีผู้ใช้งาน</h2><p>สร้างบัญชีแยกตามบทบาทด้วยรหัส 5 หลัก เพื่อบันทึกงานกันลืมและติดตามงานสำหรับคุณครู</p></div><button class="ghost" data-page="school">← กลับหน้าหลัก</button></div><div class="tracking-grid"><form class="panel" id="registerSchoolForm"><h3>สร้างบัญชีใหม่</h3><label>ประเภทบัญชี<select id="regRole"><option value="student">นักเรียน</option><option value="teacher">คุณครู</option></select></label><label>รหัสนักเรียน / รหัสคุณครู (5 หลัก)<input id="regId" required inputmode="numeric" pattern="[0-9]{5}" minlength="5" maxlength="5" placeholder="เช่น 12345"/></label><label>ชื่อที่ใช้แสดง<input id="regName" required maxlength="80" placeholder="ชื่อสำหรับแสดงในระบบ"/></label><label>ห้องเรียน / กลุ่มงาน (ถ้ามี)<input id="regClass" maxlength="30" placeholder="เช่น ม.1/9 หรือ กลุ่มครู"/></label><label>รหัสผ่าน (อย่างน้อย 8 ตัว)<input id="regPassword" required type="password" minlength="8" autocomplete="new-password"/></label><label>ยืนยันรหัสผ่าน<input id="regPassword2" required type="password" minlength="8" autocomplete="new-password"/></label><button class="primary full">ลงทะเบียนบัญชี</button><div id="registerMsg" class="form-msg" role="status">บัญชีจริงต้องเชื่อม Firebase Auth และ Firestore พร้อมกฎความปลอดภัยที่ถูกต้อง</div></form><form class="panel" id="schoolLoginForm"><h3>เข้าสู่ระบบ</h3><label>ประเภทบัญชี<select id="loginRole"><option value="student">นักเรียน</option><option value="teacher">คุณครู</option></select></label><label>รหัส 5 หลัก<input id="loginId" required inputmode="numeric" pattern="[0-9]{5}" maxlength="5"/></label><label>รหัสผ่าน<input id="loginPassword" type="password" required autocomplete="current-password"/></label><button class="gold full">เข้าสู่ระบบ</button><div id="schoolLoginMsg" class="form-msg" role="status"></div><div class="note">ไม่ควรใช้รหัสผ่านเดียวกับอีเมลหรือบัญชีส่วนตัว และไม่ควรส่งรหัสผ่านผ่านรายงานปัญหา</div></form></div></section>`}
function issuesPage(){const recent=readIssues().slice(0,6);return `<section class="page"><div class="section-head"><div><span class="eyebrow">CRT-AI • ERROR REPORT STATION</span><h2>ศูนย์รายงานปัญหา</h2><p>สถานีรายงานข้อผิดพลาดและรับความคิดเห็นของโครงการ TUPP Homework AI ภายใต้กรอบโครงการสภา CRT-AI</p></div><button class="ghost" data-page="school">← กลับหน้าหลัก</button></div><div class="cards"><article class="card"><span class="card-kicker">01 / REPORT</span><h3>รายงานปัญหา</h3><p>แจ้งอาการ ขอบเขตผลกระทบ เวลาเริ่มพบ และข้อมูลประกอบที่จำเป็น</p></article><article class="card"><span class="card-kicker">02 / FEEDBACK</span><h3>ส่งความคิดเห็น</h3><p>ข้อเสนอแนะเพื่อปรับปรุงประสบการณ์ใช้งาน ไม่จำเป็นต้องแนบข้อมูลส่วนบุคคล</p></article><article class="card"><span class="card-kicker">03 / TRACK</span><h3>ติดตามสถานะ</h3><p>เก็บหมายเลขอ้างอิงไว้เพื่อตรวจสอบสถานะรายงานบนอุปกรณ์นี้</p></article></div><div class="tracking-grid" style="margin-top:18px"><form class="panel" id="issueForm"><h3>แบบฟอร์มแจ้งปัญหา / ความคิดเห็น</h3><label>หัวข้อเรื่อง<input id="issueTitle" required maxlength="140" placeholder="สรุปปัญหาที่พบ"/></label><div class="two"><label>ประเภท<select id="issueType"><option>ข้อผิดพลาดของระบบ</option><option>บัญชี / การเข้าสู่ระบบ</option><option>การบ้าน / ติดตามงาน</option><option>AI / คำตอบไม่ถูกต้อง</option><option>ความเป็นส่วนตัว / ความปลอดภัย</option><option>ข้อเสนอแนะ</option><option>อื่น ๆ</option></select></label><label>ระดับความรุนแรง<select id="issueSeverity"><option value="low">ต่ำ — กระทบเล็กน้อย</option><option value="medium" selected>ปานกลาง — งานบางส่วนติดขัด</option><option value="high">สูง — ฟังก์ชันสำคัญใช้ไม่ได้</option><option value="critical">วิกฤต — ความปลอดภัยหรือข้อมูลเสี่ยง</option></select></label></div><div class="two"><label>ระยะเวลาที่พบ<select id="issueDuration"><option>เพิ่งพบ</option><option>น้อยกว่า 1 ชั่วโมง</option><option>1–24 ชั่วโมง</option><option>1–3 วัน</option><option>มากกว่า 3 วัน</option><option>เกิดซ้ำเป็นระยะ</option></select></label><label>วันและเวลาที่พบ<input id="issueWhen" type="datetime-local" required/></label></div><label>รายละเอียด / ขั้นตอนที่ทำให้เกิดปัญหา<textarea id="issueDetails" required maxlength="4000" placeholder="เกิดอะไรขึ้น เห็นข้อความใด และลองทำขั้นตอนใดแล้ว (อย่าใส่รหัสผ่านหรือข้อมูลลับ) "></textarea></label><label>ความคิดเห็นเพิ่มเติม (ไม่บังคับ)<textarea id="issueComments" maxlength="2500" placeholder="ข้อมูลอื่นที่จำเป็นต่อการตรวจสอบ"></textarea></label><label>ส่งถึง<select id="issueRecipient"><option value="ocao">OCAO / ผู้ดูแลโครงการ</option><option value="owners">เจ้าของโครงการ 4 บัญชี</option></select></label><label style="display:flex;gap:10px;align-items:flex-start;font-weight:600"><input id="issuePrivacyAck" type="checkbox" required style="width:auto;margin:3px 0 0"/>ฉันตรวจสอบแล้วว่าไม่ได้ใส่รหัสผ่าน ข้อมูลสุขภาพ เลขประจำตัวประชาชน หรือข้อมูลของผู้อื่นที่ไม่จำเป็น</label><button class="primary full">ส่งรายงานและสร้างหมายเลขติดตาม</button><div class="form-msg" id="issueMsg" role="status"></div></form><div class="panel"><h3>ติดตามสถานะรายงาน</h3><form id="issueTrackForm"><label>หมายเลขรายงาน<input id="issueTrackId" required placeholder="เช่น CRT-..." value="${esc(app.issueQuery)}"/></label><button class="gold full">ค้นหาสถานะ</button></form><div id="issueTrackResult" class="note" aria-live="polite">${app.issueStatusResult?esc(app.issueStatusResult):'เมื่อส่งรายงานสำเร็จ ระบบจะแสดงหมายเลขอ้างอิงและบันทึกไว้ในอุปกรณ์นี้'}</div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>รายงานล่าสุดบนอุปกรณ์นี้</h3>${recent.map(x=>`<div class="registry"><b>${esc(x.ticket)} · ${esc(x.title)}</b><span>${esc(x.status)} • ${esc(x.createdLocal)}</span></div>`).join('')||'<div class="empty">ยังไม่มีรายงานที่บันทึกไว้บนอุปกรณ์นี้</div>'}<div class="note">การบันทึกในอุปกรณ์นี้ไม่เท่ากับการรับเรื่องจากผู้ดูแล ระบบ Firebase จะบันทึกส่วนกลางได้เมื่อมีการตั้งค่าและกฎอนุญาตแล้ว</div></div></div><div class="panel" style="margin-top:18px"><h3>ช่องแจ้งเตือน — สถานีรายงานข้อผิดพลาด (ภาษาไทย)</h3><p>โปรดเก็บหมายเลขรายงานไว้ ระบบจะแสดงข้อความยืนยันเมื่อบันทึกได้ หากพบเหตุที่เกี่ยวข้องกับความปลอดภัยหรือข้อมูลส่วนบุคคล ให้หลีกเลี่ยงการส่งข้อมูลอ่อนไหวเพิ่ม และส่งเฉพาะรายละเอียดที่จำเป็น</p><div class="note">ผู้รับเรื่องตามที่เลือก: OCAO / เจ้าของโครงการ 4 บัญชี — ${OWNER_EMAILS.map(esc).join(' • ')}</div></div></section>`}
function legalPage(){return `<section class="page"><div class="section-head"><div><span class="eyebrow">CRT-AI • PRIVACY & LEGAL</span><h2>กฎหมายและการคุ้มครองข้อมูล</h2><p>เอกสารประกอบสำหรับโครงการ TUPP Homework AI โดยสรุปหลักกฎหมายที่เกี่ยวข้องและแนวทางใช้งานอย่างรับผิดชอบ</p></div><button class="ghost" data-page="school">← กลับหน้าหลัก</button></div><div class="panel legal"><h3>ประกาศสำคัญก่อนใช้งาน</h3><p><b>สถานะของเอกสาร:</b> ข้อความนี้เป็นข้อมูลทั่วไปเพื่อช่วยให้เข้าใจประเด็นกฎหมาย ไม่ใช่คำปรึกษากฎหมาย ไม่ใช่ประกาศความเป็นส่วนตัวฉบับที่ผ่านการรับรองจากโรงเรียน และไม่ได้หมายความว่า CRT-AI เป็นหน่วยงานราชการหรือผู้ควบคุมข้อมูลของโรงเรียนโดยอัตโนมัติ ผู้จัดทำระบบต้องระบุผู้ควบคุมข้อมูล ผู้ประมวลผล ช่องทางติดต่อ วัตถุประสงค์ ฐานกฎหมาย และระยะเวลาเก็บรักษาที่แท้จริงก่อนเปิดใช้งานจริง</p><h3>1. พระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562 (PDPA)</h3><p>ข้อมูลส่วนบุคคลคือข้อมูลที่ทำให้ระบุตัวบุคคลได้ไม่ว่าทางตรงหรือทางอ้อม รหัสนักเรียน ชื่อ ห้องเรียน ประวัติการส่งงาน บันทึกการใช้งาน หมายเลขรายงานปัญหา และข้อมูลบัญชีอาจเป็นข้อมูลส่วนบุคคลเมื่อเชื่อมโยงถึงบุคคลได้ การนำข้อมูลเหล่านี้มาเก็บ ใช้ เปิดเผย หรือส่งต่อจึงควรทำอย่างมีวัตถุประสงค์ชัดเจน จำกัดเท่าที่จำเป็น และแจ้งให้ผู้ใช้ทราบอย่างโปร่งใส</p><p>มาตรา 22 วางหลักให้เก็บข้อมูลเท่าที่จำเป็นต่อวัตถุประสงค์ที่ชอบด้วยกฎหมาย ส่วนมาตรา 23 กล่าวถึงการแจ้งรายละเอียดก่อนหรือขณะเก็บข้อมูล เช่น วัตถุประสงค์ ประเภทข้อมูล ระยะเวลาเก็บ ผู้รับข้อมูล ช่องทางติดต่อ และสิทธิของเจ้าของข้อมูล ในกรณีที่กฎหมายกำหนด ข้อมูลไม่ควรถูกเก็บเพียงเพราะระบบทำได้ และไม่ควรใช้ข้อมูลที่รวบรวมเพื่อการติดตามการบ้านไปทำวัตถุประสงค์อื่นโดยไม่ตรวจสอบฐานกฎหมายและหน้าที่แจ้งข้อมูลให้เหมาะสม</p><p>การประมวลผลข้อมูลต้องมีฐานทางกฎหมายที่ถูกต้องตามสถานการณ์ ไม่ใช่ทุกกรณีต้องใช้ความยินยอม และไม่ใช่การกดปุ่มยอมรับครั้งเดียวจะทำให้การใช้ข้อมูลทุกอย่างชอบด้วยกฎหมาย ผู้รับผิดชอบควรพิจารณาว่าจำเป็นต่อสัญญา ภารกิจเพื่อประโยชน์สาธารณะ ประโยชน์โดยชอบด้วยกฎหมาย หรือฐานอื่นที่กฎหมายกำหนดหรือไม่ โดยคำนึงถึงอายุและสถานะของผู้ใช้ หากเป็นผู้เยาว์ต้องพิจารณาหลักเกณฑ์เรื่องความสามารถและความยินยอมที่เกี่ยวข้องเป็นพิเศษ</p><p>ข้อมูลส่วนบุคคลที่มีความอ่อนไหวตามมาตรา 26 เช่น ข้อมูลสุขภาพ ความพิการ ชีวมิติ ความเชื่อ ศาสนา หรือข้อมูลอื่นตามที่กฎหมายระบุ ต้องได้รับการดูแลเข้มงวดเป็นพิเศษ ไม่ควรให้แบบฟอร์มรายงานปัญหาขอข้อมูลดังกล่าวหากไม่จำเป็นอย่างยิ่ง ห้ามส่งรหัสผ่าน โทเคนเข้าระบบ ข้อมูลทางการเงิน หรือข้อมูลส่วนตัวของบุคคลอื่นในช่องความคิดเห็น</p><h3>2. สิทธิของเจ้าของข้อมูล</h3><p>ภายใต้เงื่อนไขและข้อยกเว้นของกฎหมาย เจ้าของข้อมูลอาจมีสิทธิขอเข้าถึงหรือรับสำเนาข้อมูล ขอรับข้อมูลในรูปแบบที่กฎหมายกำหนด คัดค้านการประมวลผล ขอให้ลบ ทำลาย หรือทำให้ไม่สามารถระบุตัวบุคคล ขอให้ระงับการใช้ ขอแก้ไขข้อมูลให้ถูกต้อง และร้องเรียนต่อหน่วยงานที่มีอำนาจ การใช้สิทธิต้องตรวจสอบตัวตนอย่างเหมาะสมและไม่เปิดเผยข้อมูลของบุคคลอื่น การลบข้อมูลอาจมีข้อยกเว้นตามกฎหมายหรือหน้าที่การเก็บรักษา</p><p>ระบบที่ใช้งานจริงควรมีช่องทางขอใช้สิทธิและผู้รับผิดชอบที่ระบุชัดเจน พร้อมกระบวนการยืนยันคำขอ บันทึกการดำเนินการ และตอบกลับภายในระยะเวลาตามกฎหมายที่เกี่ยวข้อง อย่าใส่ที่อยู่อีเมลส่วนตัวของผู้ดูแลเป็นช่องทางอย่างเป็นทางการจนกว่าจะได้รับอนุญาตและกำหนดผู้รับผิดชอบจริง</p><h3>3. ความมั่นคงปลอดภัยและเหตุละเมิดข้อมูล</h3><p>ผู้รับผิดชอบระบบควรใช้มาตรการที่เหมาะสมเพื่อป้องกันการเข้าถึง แก้ไข เปิดเผย สูญหาย หรือทำลายข้อมูลโดยไม่ได้รับอนุญาต เช่น จำกัดสิทธิ์ตามบทบาท ตรวจสอบสิทธิ์ฝั่งเซิร์ฟเวอร์ ใช้การเชื่อมต่อเข้ารหัส ไม่เปิดฐานข้อมูลสาธารณะ จัดการรหัสผ่านผ่านระบบยืนยันตัวตนที่ได้มาตรฐาน บันทึกเหตุการณ์เท่าที่จำเป็น ทบทวนบัญชีผู้ดูแล และมีแผนรับมือเหตุการณ์</p><p>เมื่อสงสัยว่าเกิดเหตุละเมิดข้อมูล ต้องจำกัดความเสียหาย เก็บหลักฐานที่จำเป็น แจ้งผู้รับผิดชอบความปลอดภัย และประเมินหน้าที่แจ้งสำนักงานคณะกรรมการคุ้มครองข้อมูลส่วนบุคคลและเจ้าของข้อมูลตามเงื่อนไขและกรอบเวลาที่กฎหมายกำหนด โดยมาตรา 37 มีหน้าที่บางประการเกี่ยวกับมาตรการความปลอดภัยและการแจ้งเหตุละเมิด การตัดสินใจต้องอิงข้อเท็จจริงและคำแนะนำของผู้รับผิดชอบ ไม่ควรสรุปเองว่าเหตุเล็กน้อยจึงไม่ต้องดำเนินการ</p><h3>4. การเก็บรักษา การเปิดเผย และผู้ให้บริการภายนอก</h3><p>ก่อนใช้ Firebase, Gemini หรือบริการคลาวด์อื่นจริง ต้องตรวจสอบข้อกำหนดผู้ให้บริการ สถานที่จัดเก็บและการโอนข้อมูลระหว่างประเทศ บทบาทของผู้ให้บริการ ข้อตกลงประมวลผลข้อมูล การตั้งค่าการเก็บ log และการใช้ข้อมูลเพื่อปรับปรุงบริการ ไม่ควรส่งข้อมูลระบุตัวนักเรียนหรือข้อมูลการเรียนที่ระบุตัวบุคคลได้ให้ AI หากไม่จำเป็นและไม่ได้ผ่านการพิจารณาฐานกฎหมายและมาตรการที่เหมาะสม ควรใช้ข้อมูลสมมติหรือลบข้อมูลระบุตัวบุคคลออกก่อนทดสอบ</p><p>กำหนดอายุข้อมูลตามวัตถุประสงค์ เช่น ระยะเวลาเก็บรายงานปัญหา ระยะเวลาเก็บบันทึกความปลอดภัย และกระบวนการลบหรือทำให้ไม่สามารถระบุตัวบุคคลได้เมื่อหมดความจำเป็น การเก็บข้อมูลไม่มีกำหนดเพียงเพื่อความสะดวกเพิ่มความเสี่ยงและไม่สอดคล้องกับหลักเก็บเท่าที่จำเป็น</p><h3>5. พระราชบัญญัติว่าด้วยการกระทำความผิดเกี่ยวกับคอมพิวเตอร์ และการใช้งานอย่างสุจริต</h3><p>ผู้ใช้ควรเข้าถึงเฉพาะบัญชีและข้อมูลที่ตนได้รับอนุญาต ไม่ทดลองเจาะระบบ ไม่เปลี่ยนแปลงข้อมูลของผู้อื่น ไม่เผยแพร่ข้อมูลเท็จหรือข้อมูลส่วนตัวโดยไม่ชอบ และไม่ใช้ระบบรายงานปัญหาเพื่อกลั่นแกล้ง คุกคาม หรือส่งเนื้อหาที่ผิดกฎหมาย การประเมินว่าเหตุใดเข้าข่ายความผิดหรือไม่ต้องดูองค์ประกอบกฎหมายและข้อเท็จจริงเป็นรายกรณี ข้อความนี้ไม่ได้กล่าวหาว่าการกระทำใดเป็นความผิดโดยอัตโนมัติ</p><h3>6. แนวปฏิบัติสำหรับนักเรียนและครู</h3><ul><li>ตั้งรหัสผ่านที่คาดเดายากและไม่ใช้ซ้ำกับบัญชีอื่น</li><li>ไม่เปิดเผยรหัสผ่านให้เพื่อน ครู หรือผู้รับรายงาน และไม่ใส่รหัสผ่านลงในช่องรายงานปัญหา</li><li>ครูควรเปิดดูเฉพาะข้อมูลนักเรียนที่จำเป็นต่อหน้าที่ และไม่ส่งออกหรือเผยแพร่รายการคะแนน/การบ้านในที่สาธารณะ</li><li>นักเรียนควรส่งรายงานที่สุภาพ เป็นข้อเท็จจริง และไม่แนบข้อมูลของบุคคลอื่นโดยไม่จำเป็น</li><li>หากเห็นข้อมูลที่ไม่ควรเข้าถึง ให้หยุดเปิดดูและแจ้งผู้ดูแลผ่านช่องทางที่กำหนด ไม่ควรดาวน์โหลดหรือแชร์ต่อ</li><li>ผู้ดูแลควรตรวจสิทธิ์บัญชีและกฎฐานข้อมูลเป็นระยะ รวมถึงทบทวนการเข้าถึงของผู้ที่พ้นหน้าที่</li></ul><h3>7. ขอบเขตความรับผิดชอบของ CRT-AI</h3><p>สถานีนี้จัดทำเป็นส่วนหนึ่งของโครงการ TUPP Homework AI โดยใช้ชื่อ CRT-AI เพื่อระบุกรอบโครงการด้านการกำกับดูแล การวิจัย เทคโนโลยี และปัญญาประดิษฐ์เท่านั้น การแสดงชื่อ CRT-AI ไม่ได้เป็นการยืนยันว่าเป็นหน่วยงานราชการ หน่วยงานของโรงเรียน หรือได้รับการแต่งตั้งอย่างเป็นทางการ การอนุมัติใช้งานจริง การกำหนดผู้ควบคุมข้อมูล และการติดต่อหน่วยงานโรงเรียนต้องดำเนินการโดยผู้มีอำนาจตามจริง</p><h3>8. สิ่งที่ต้องทำก่อนเปิดใช้จริง</h3><ol><li>จัดทำ Privacy Notice ที่ระบุผู้ควบคุมข้อมูล ช่องทางติดต่อ ฐานกฎหมาย วัตถุประสงค์ ระยะเวลาเก็บ และผู้รับข้อมูลจริง</li><li>ตั้ง Firebase Authentication และ Firestore Security Rules โดยปฏิเสธการเข้าถึงเป็นค่าเริ่มต้น และตรวจสิทธิ์ในฝั่งเซิร์ฟเวอร์</li><li>ไม่ใช้รหัสนักเรียน 5 หลักเป็นข้อมูลลับเพียงอย่างเดียว เพราะมีจำนวนความเป็นไปได้จำกัด ต้องมีรหัสผ่านและมาตรการป้องกันการเดารหัส</li><li>กำหนดขั้นตอนการกู้คืนบัญชี การปิดบัญชี การลบข้อมูล และการจัดการเหตุละเมิด</li><li>ตรวจสอบการใช้บริการ AI และผู้ให้บริการภายนอกก่อนส่งข้อมูลจริง</li><li>ให้ผู้รับผิดชอบด้านกฎหมาย/ข้อมูลส่วนบุคคลตรวจทานก่อนเผยแพร่</li></ol><div class="note">แหล่งอ้างอิงทางการสำหรับอ่านกฎหมายฉบับเต็ม: กรมที่ดิน/หน้ารวม PDPA, สำนักงานคณะกรรมการกฤษฎีกาหรือราชกิจจานุเบกษา และกระทรวงดิจิทัลเพื่อเศรษฐกิจและสังคม โปรดตรวจฉบับและกฎลำดับรองล่าสุดก่อนใช้งานจริง</div><p>แหล่งอ่านเพิ่มเติม: <a href="https://www.dol.go.th/pdpa/new-home/" target="_blank" rel="noreferrer">หน้ารวมกฎหมาย PDPA</a> · <a href="https://law.prd.go.th/th/content/category/detail/id/2475/iid/234607" target="_blank" rel="noreferrer">พระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562</a> · <a href="https://www.mdes.go.th/law/128" target="_blank" rel="noreferrer">กฎหมายว่าด้วยการกระทำความผิดเกี่ยวกับคอมพิวเตอร์</a></p></div></section>`}
shell = function(){const adminAllowed=Boolean(app.member&&app.member.active!==false);const pages={school:school(),tracking:tracking(),ai:ai(),admin:adminAllowed?admin():school(),account:accountPage(),issues:issuesPage(),legal:legalPage()};document.getElementById('root').innerHTML=`<div class="app"><header class="top"><div class="brand"><div class="logo"><canvas data-electric></canvas></div><div><div class="brand-title">TUPP HOMEWORK AI</div><div class="brand-sub">ต.อ.พ.ภ. • CRT-AI Project Operations</div></div></div><div class="top-actions"><span class="status-dot ${state.fb.booted?'ok':''}"></span><span class="tiny">FIREBASE ${state.fb.booted?'READY':'NOT CONFIGURED'}</span><button class="admin-entry" id="openCouncil">COUNCIL / ADMIN</button>${app.session?'<button class="ghost" id="logout">ออกจากระบบ</button>':''}</div></header><nav class="nav"><button class="${app.page==='school'?'active':''}" data-page="school"><b>01</b><span>หน้าหลัก</span></button><button class="${app.page==='tracking'?'active':''}" data-page="tracking"><b>02</b><span>บันทึกงานกันลืม / ติดตามงาน</span></button><button class="${app.page==='ai'?'active':''}" data-page="ai"><b>03</b><span>Homework AI</span></button><button class="${app.page==='account'?'active':''}" data-page="account"><b>04</b><span>สมัคร / เข้าสู่ระบบ</span></button><button class="${app.page==='issues'?'active':''}" data-page="issues"><b>05</b><span>รายงานปัญหา</span></button><button class="${app.page==='legal'?'active':''}" data-page="legal"><b>06</b><span>กฎหมาย / ความเป็นส่วนตัว</span></button><button class="${app.page==='admin'?'active':''}" data-page="admin"><b>CRT-AI</b><span>ศูนย์ควบคุม</span></button></nav><main>${pages[app.page]||school()}</main><div class="footer">TUPP Homework AI • CRT-AI Project • ต.อ.พ.ภ. • Independent project prototype • ระบบตัวอย่าง ต้องตั้งค่ากฎ Firebase ก่อนใช้กับข้อมูลจริง</div>${app.authOpen?authModal():''}</div>`;wire();drawLogos()};

 if(e.target.id==='registerSchoolForm'){

  if(password!==password2){msg.textContent='รหัสผ่านทั้งสองช่องไม่ตรงกัน';return}msg.textContent='กำลังสร้างบัญชี…';
  try{const r=await registerSchoolAccount(role,id,password,name,classRoom);app.session=r.user;app.userProfile=r.profile;app.studentId=role==='student'?id:app.studentId;msg.textContent='ลงทะเบียนสำเร็จ';app.status='ลงทะเบียนบัญชีสำเร็จ';await audit('ACCOUNT_REGISTERED',{role,schoolId:id});nav('tracking')}catch(x){msg.textContent='ลงทะเบียนไม่สำเร็จ: '+x.message}
 }
 if(e.target.id==='schoolLoginForm'){
  e.preventDefault();const role=document.getElementById('loginRole').value,id=document.getElementById('loginId').value.trim(),password=document.getElementById('loginPassword').value,msg=document.getElementById('schoolLoginMsg');msg.textContent='กำลังตรวจสอบบัญชี…';
  try{const r=await schoolAccountLogin(role,id,password);app.session=r.user;app.userProfile=r.profile;app.studentId=role==='student'?id:app.studentId;await audit('SCHOOL_ACCOUNT_LOGIN',{role,schoolId:id});msg.textContent='เข้าสู่ระบบสำเร็จ';nav(role==='teacher'?'tracking':'tracking')}catch(x){msg.textContent='เข้าสู่ระบบไม่สำเร็จ: '+x.message}
 }
 if(e.target.id==='issueForm'){
  e.preventDefault();const ticket=makeTicket();const createdLocal=new Date().toLocaleString('th-TH');const report={ticket,title:document.getElementById('issueTitle').value.trim(),type:document.getElementById('issueType').value,severity:document.getElementById('issueSeverity').value,duration:document.getElementById('issueDuration').value,foundAt:document.getElementById('issueWhen').value,details:document.getElementById('issueDetails').value.trim(),comments:document.getElementById('issueComments').value.trim(),recipient:document.getElementById('issueRecipient').value,status:'รับรายงานไว้ในอุปกรณ์แล้ว — รอการตรวจสอบ',createdLocal,createdAt:new Date().toISOString(),project:'TUPP Homework AI / CRT-AI'};
  const msg=document.getElementById('issueMsg');const rows=readIssues();rows.unshift(report);saveIssues(rows.slice(0,100));
  try{if(firebaseConfigured()){await initFirebase();await setDoc(doc(state.db,'issueReports',ticket),{...report,createdAt:serverTimestamp(),reporterUid:app.session?.uid||null});report.status='ส่งเข้าระบบ Firebase แล้ว — รอผู้ดูแลตรวจสอบ';const r2=readIssues().map(x=>x.ticket===ticket?report:x);saveIssues(r2)} }catch(err){report.status='บันทึกในอุปกรณ์แล้ว แต่ Firebase ส่งไม่สำเร็จ';saveIssues(readIssues().map(x=>x.ticket===ticket?report:x))}
  app.issueQuery=ticket;app.issueStatusResult=`${ticket} — ${report.status}`;msg.innerHTML=`<b>สร้างรายงานแล้ว: ${esc(ticket)}</b><br>${esc(report.status)}<br><button type="button" class="ghost" id="copyTicket" data-ticket="${esc(ticket)}">คัดลอกหมายเลข</button> <button type="button" class="ghost" id="composeReportMail">เปิดอีเมลแจ้งผู้รับ</button>`;
  const recipients=document.getElementById('issueRecipient').value==='owners'?OWNER_EMAILS.join(','):'rachata.le@gmail.com,06554@tupp.ac.th,thanawinnoble07@gmail.com,06546@tupp.ac.th';
  document.getElementById('composeReportMail').dataset.mailto=recipients;document.getElementById('composeReportMail').dataset.subject=`[CRT-AI Error Report] ${ticket} - ${report.title}`;document.getElementById('composeReportMail').dataset.body=`โครงการ: TUPP Homework AI / CRT-AI\nหมายเลข: ${ticket}\nหัวข้อ: ${report.title}\nประเภท: ${report.type}\nระดับ: ${report.severity}\nระยะเวลาที่พบ: ${report.duration}\nวันเวลาที่พบ: ${report.foundAt}\nรายละเอียด: ${report.details}\nความคิดเห็นเพิ่มเติม: ${report.comments}\nสถานะในเครื่อง: ${report.status}\n\nโปรดตรวจสอบรายงานนี้ผ่านช่องทางที่เหมาะสม`;
  document.getElementById('issueTrackResult').textContent=`${ticket} — ${report.status}`;document.getElementById('issueTrackId').value=ticket;document.getElementById('issueTitle').value='';document.getElementById('issueDetails').value='';document.getElementById('issueComments').value='';
 }
 if(e.target.id==='issueTrackForm'){
  e.preventDefault();const id=document.getElementById('issueTrackId').value.trim().toUpperCase();app.issueQuery=id;let found=readIssues().find(x=>x.ticket.toUpperCase()===id);const el=document.getElementById('issueTrackResult');el.textContent='กำลังค้นหาสถานะ…';if(!found&&firebaseConfigured()){try{await initFirebase();const snap=await retry(()=>getDoc(doc(state.db,'issueReports',id)));if(snap.exists())found=snap.data()}catch(err){el.textContent='ค้นหาจาก Firebase ไม่สำเร็จ: '+err.message;app.issueStatusResult=el.textContent;return}}el.textContent=found?`${found.ticket} — ${found.status} | ประเภท: ${found.type} | ความรุนแรง: ${found.severity} | บันทึกเมื่อ ${found.createdLocal||'เวลาไม่พร้อมใช้งาน'}`:'ไม่พบหมายเลขรายงาน กรุณาตรวจสอบหมายเลข หรือยืนยันว่าระบบ Firebase ถูกตั้งค่าและอนุญาตให้อ่านสถานะ';app.issueStatusResult=el.textContent;
 }
});

      <div class="gate-switch"><button type="button" class="active" data-gate-tab="login">เข้าสู่ระบบ</button><button type="button" data-gate-tab="register">ลงทะเบียน</button><button type="button" data-gate-tab="council">CRT-AI / OCAO</button></div>
      <form class="gate-form active" id="gateLoginForm"><label>ประเภทบัญชี<select id="gateLoginRole"><option value="student">นักเรียน</option><option value="teacher">คุณครู</option></select></label><label>รหัสประจำตัว 5 หลัก<input id="gateLoginId" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" placeholder="เช่น 12345" required></label><label>รหัสผ่าน<input id="gateLoginPassword" type="password" autocomplete="current-password" required></label><button type="submit">เข้าสู่หน้าหลัก</button><div class="gate-msg" id="gateLoginMsg" role="status"></div></form>
      <form class="gate-form" id="gateRegisterForm"><label>ประเภทบัญชี<select id="gateRegRole"><option value="student">นักเรียน</option><option value="teacher">คุณครู</option></select></label><div class="gate-two"><label>รหัสประจำตัว 5 หลัก<input id="gateRegId" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" placeholder="12345" required></label><label>ชื่อที่แสดง<input id="gateRegName" maxlength="80" placeholder="ชื่อ-นามสกุล" required></label></div><label>ห้องเรียน / กลุ่มงาน<input id="gateRegClass" maxlength="40" placeholder="เช่น ม.4/1 หรือ กลุ่มสาระ"></label><div class="gate-two"><label>สร้างรหัสผ่าน<input id="gateRegPassword" type="password" minlength="8" autocomplete="new-password" required></label><label>ยืนยันรหัสผ่าน<input id="gateRegPassword2" type="password" minlength="8" autocomplete="new-password" required></label></div><button type="submit">สร้างบัญชีและเข้าระบบ</button><div class="gate-msg" id="gateRegMsg" role="status"></div><div class="gate-hint">รหัสประจำตัวต้องมี 5 หลัก รหัสผ่านอย่างน้อย 8 ตัวอักษร และต้องเปิดใช้ Firebase Authentication + Firestore ก่อนลงทะเบียน</div></form>
      <form class="gate-form" id="gateCouncilForm"><label>อีเมลสมาชิกสภา<input id="gateCouncilEmail" type="email" value="rachata.le@gmail.com" autocomplete="username" required></label><label>รหัสผ่าน<input id="gateCouncilPassword" type="password" autocomplete="current-password" required></label><button type="submit">เข้าสู่ Council Control</button><div class="gate-msg" id="gateCouncilMsg" role="status"></div><div class="gate-hint">ใช้บัญชีที่มีอยู่ใน Firebase Authentication และต้องมีเอกสารสิทธิ์ใน Council Directory จึงจะเข้าแผงควบคุมได้</div></form>
      <button type="button" class="gate-action gate-secondary" id="gateConfigToggle">ตั้งค่า Firebase / แก้ปัญหาเปิดระบบ</button><div class="gate-config" id="gateConfigBox"><p style="font-size:12px;line-height:1.6">วาง Firebase web config เป็น JSON จาก Firebase Console → Project settings → Your apps</p><textarea id="gateConfigJson" placeholder='{"apiKey":"...","authDomain":"...","projectId":"...","appId":"..."}'></textarea><button type="button" class="gate-action" id="gateSaveConfig">บันทึกการตั้งค่า</button><div class="gate-msg" id="gateConfigMsg"></div></div>
      <div class="gate-footer">TUPP Homework AI • CRT-AI เป็นกรอบโครงการอิสระ ไม่ใช่การยืนยันสถานะหน่วยงานทางการของโรงเรียน</div>
    </section></div>`;
  document.body.appendChild(gate);
  const tabs=[...gate.querySelectorAll('[data-gate-tab]')];
  function tab(name){tabs.forEach(b=>b.classList.toggle('active',b.dataset.gateTab===name));gate.querySelectorAll('.gate-form').forEach(f=>f.classList.toggle('active',f.id==={login:'gateLoginForm',register:'gateRegisterForm',council:'gateCouncilForm'}[name]));document.getElementById('gateTitle').textContent={login:'เข้าสู่ระบบ',register:'สร้างบัญชีผู้ใช้งาน',council:'สมาชิกสภา CRT-AI / OCAO'}[name];}
  tabs.forEach(b=>b.addEventListener('click',()=>tab(b.dataset.gateTab)));
  document.getElementById('gateConfigToggle').onclick=()=>document.getElementById('gateConfigBox').classList.toggle('open');
  document.getElementById('gateSaveConfig').onclick=()=>{const m=document.getElementById('gateConfigMsg');try{const c=JSON.parse(document.getElementById('gateConfigJson').value);if(!c.apiKey||!c.authDomain||!c.projectId||!c.appId)throw Error('ต้องมี apiKey, authDomain, projectId และ appId');localStorage.setItem(cfgKey,JSON.stringify(c));firebaseConfig=c;state.fb.booted=false;state.fb.configured=false;state.app=null;state.auth=null;state.db=null;m.style.color='#067647';m.textContent='บันทึก config แล้ว ลองลงทะเบียนหรือเข้าสู่ระบบอีกครั้ง';}catch(e){m.textContent='Config ไม่ถูกต้อง: '+e.message}};
  document.getElementById('gateLoginForm').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('gateLoginMsg');m.textContent='กำลังตรวจสอบบัญชี…';try{const role=document.getElementById('gateLoginRole').value,id=document.getElementById('gateLoginId').value.trim(),pw=document.getElementById('gateLoginPassword').value;const r=await schoolAccountLogin(role,id,pw);app.session=r.user;app.userProfile=r.profile;app.studentId=role==='student'?id:'';await audit('SCHOOL_ACCOUNT_LOGIN',{role,schoolId:id});gate.remove();render();}catch(err){m.textContent='เข้าสู่ระบบไม่สำเร็จ: '+err.message+(firebaseConfigured()?'':' · กรุณาตั้งค่า Firebase ด้านล่าง')}});
  document.getElementById('gateRegisterForm').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('gateRegMsg');const role=document.getElementById('gateRegRole').value,id=document.getElementById('gateRegId').value.trim(),pw=document.getElementById('gateRegPassword').value,pw2=document.getElementById('gateRegPassword2').value;if(pw!==pw2){m.textContent='รหัสผ่านทั้งสองช่องไม่ตรงกัน';return}m.textContent='กำลังสร้างบัญชี…';try{const r=await registerSchoolAccount(role,id,pw,document.getElementById('gateRegName').value,document.getElementById('gateRegClass').value);app.session=r.user;app.userProfile=r.profile;app.studentId=role==='student'?id:'';await audit('SCHOOL_ACCOUNT_REGISTER',{role,schoolId:id});gate.remove();render();}catch(err){m.textContent='ลงทะเบียนไม่สำเร็จ: '+err.message+(firebaseConfigured()?'':' · กรุณาตั้งค่า Firebase ด้านล่าง')}});
  document.getElementById('gateCouncilForm').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('gateCouncilMsg');m.textContent='กำลังตรวจสอบสิทธิ์…';try{const r=await councilLogin(document.getElementById('gateCouncilEmail').value,document.getElementById('gateCouncilPassword').value);app.session=r.user;app.member=r.member;await audit('COUNCIL_LOGIN',{email:r.user.email,roles:r.member.roles||[]});gate.remove();app.page='admin';render();}catch(err){m.textContent='เข้าสู่ระบบไม่สำเร็จ: '+err.message+(firebaseConfigured()?'':' · ตั้งค่า Firebase ด้านล่างก่อน')}});
}

mountSecureEntry();

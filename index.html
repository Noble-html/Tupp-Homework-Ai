import { getFirestore, doc, getDoc, addDoc, updateDoc, setDoc, collection, query, where, orderBy, limit, onSnapshot, serverTimestamp, enableMultiTabIndexedDbPersistence } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';

];
const state={app:null,auth:null,db:null,fb:{configured:false,booted:false,persistence:'not-initialized',retryCount:0,lastError:'',lastSuccessAt:null,activeListeners:0},listeners:new Set()};
const cfgKey='tupp_ai_v43_firebase_config';
const defaultFirebaseConfig = {
  apiKey: "AIzaSyBi2-gI4R2hfEXEY2pyZr67jhpdVXEOt4k",

  projectId: "tupp-homework-ai",

let firebaseConfig={...defaultFirebaseConfig, ...JSON.parse(localStorage.getItem(cfgKey)||'{}')};
function saveCfg(){localStorage.setItem(cfgKey,JSON.stringify(firebaseConfig));}
function firebaseConfigured(){return Boolean(firebaseConfig.apiKey&&firebaseConfig.authDomain&&firebaseConfig.projectId&&firebaseConfig.appId)}
async function initFirebase(){
 if(state.fb.booted)return;
 if(!firebaseConfigured())throw Error('ยังไม่ได้ตั้งค่า Firebase');
 state.app=getApps().length?getApps()[0]:initializeApp(firebaseConfig);state.auth=getAuth(state.app);state.db=getFirestore(state.app);
 try{await enableMultiTabIndexedDbPersistence(state.db);state.fb.persistence='enabled'}catch{state.fb.persistence='unavailable'}
 state.fb.booted=true;state.fb.configured=true;state.fb.lastSuccessAt=Date.now();render();
}
async function retry(fn,tries=5){let last;for(let i=0;i<tries;i++){try{const v=await fn();if(i)state.fb.retryCount++;state.fb.lastSuccessAt=Date.now();state.fb.lastError='';return v}catch(e){last=e;state.fb.lastError=e.message;if(i<tries-1)await new Promise(r=>setTimeout(r,500*Math.pow(2,i)))}}throw last}
async function councilLogin(email,password){await initFirebase();const cred=await retry(()=>signInWithEmailAndPassword(state.auth,email.trim().toLowerCase(),password));const s=await retry(()=>getDoc(doc(state.db,'councilMembers',cred.user.uid)));if(!s.exists()){await signOut(state.auth);throw Error('บัญชี Firebase นี้ยังไม่ได้ลงทะเบียนใน Council Directory')}const m=s.data();if(m.active===false){await signOut(state.auth);throw Error('บัญชี Council ถูกระงับ')}return {user:cred.user,member:m}}
const ADMIN_EMAILS=['rachata.le@gmail.com','06554@tupp.ac.th','06546@tupp.ac.th','thanawinnoble07@gmail.com'];
async function googleAdminLogin(){await initFirebase();const cred=await signInWithPopup(state.auth,new GoogleAuthProvider());const email=(cred.user.email||'').toLowerCase();if(!cred.user.emailVerified||!ADMIN_EMAILS.includes(email)){await signOut(state.auth);throw Error('บัญชี Google นี้ไม่มีสิทธิ์ ADMIN')}const r=LEGACY_COUNCIL_REGISTRY.find(x=>x.email===email);return {user:cred.user,member:{active:true,admin:true,email,roles:r?r.roles:['ADMIN'],access:r?r.access:[]}}}
async function generalLogin(){await initFirebase();return retry(()=>signInAnonymously(state.auth))}
async function audit(event,payload={}){if(!state.db||!state.auth?.currentUser)return;return retry(()=>addDoc(collection(state.db,'audit'),{event,payload,actorUid:state.auth.currentUser.uid,createdAt:serverTimestamp()}))}
async function listHomework(){await initFirebase();const q=query(collection(state.db,'homework'),orderBy('dueAt','asc'),limit(200));return new Promise((resolve,reject)=>{const stop=onSnapshot(q,s=>{state.fb.lastSuccessAt=Date.now();resolve(s.docs.map(d=>({id:d.id,...d.data()})))},e=>{state.fb.lastError=e.message;reject(e)});state.listeners.add(stop);state.fb.activeListeners=state.listeners.size})}
async function updateTaskStatus(taskId, status){await initFirebase();return retry(()=>updateDoc(doc(state.db,'homework',taskId),{status,updatedAt:serverTimestamp()}))}
async function addHomework(data){await initFirebase();return retry(()=>addDoc(collection(state.db,'homework'),{...data,createdAt:serverTimestamp(),updatedAt:serverTimestamp()}))}
async function listClass(classRoom){await initFirebase();const q=query(collection(state.db,'homework'),where('classRoom','==',classRoom),orderBy('dueAt','asc'),limit(500));return new Promise((resolve,reject)=>{const stop=onSnapshot(q,s=>resolve(s.docs.map(d=>({id:d.id,...d.data()}))),reject);state.listeners.add(stop);state.fb.activeListeners=state.listeners.size})}
async function health(){await initFirebase();const t=performance.now();const s=await retry(()=>getDoc(doc(state.db,'system','health')));return{latency:Math.round(performance.now()-t),healthDocument:s.exists()}}

const app={page:'school',session:null,member:null,authMode:'general',authOpen:false,status:'',tasks:[],classTasks:[],studentId:localStorage.getItem('tupp_ai_student_id')||'',messages:[{role:'model',text:'สวัสดีครับ ผม TUPP Homework AI ถามได้ทั้งเรื่องการเรียน การบ้าน วิทยาศาสตร์ คณิตศาสตร์ ภาษา หรือคำถามทั่วไป'}],busy:false,form:{title:'',subject:'',dueAt:'',priority:'NORMAL',scoreMax:'10',note:''},classRoom:'',geminiEndpoint:'/api/gemini'};
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function setStatus(s){app.status=s;render()}
function nav(k){app.page=k;window.scrollTo({top:0,behavior:'smooth'});render()}
function school(){return `<section class="page"><div class="hero"><div><span class="eyebrow">TUPP • SCHOOL PLATFORM</span><h1>เว็บไซต์โรงเรียน</h1><p>พื้นที่รวมข่าวสาร ประกาศ กิจกรรม และบริการสำหรับนักเรียนและครู โดยแยกจากระบบติดตามงานเพื่อให้หน้าเว็บโหลดเร็ว</p><div class="hero-actions"><a href="https://www.tupp.ac.th/" target="_blank" rel="noreferrer">เปิดเว็บไซต์ TUPP ↗</a><button data-go="tracking">ไปติดตามงาน →</button></div></div><div class="hero-mark"><div class="logo"><canvas data-electric></canvas></div></div></div><div class="cards"><article class="card"><span class="card-kicker">TUPP</span><h3>ประกาศและข่าว</h3><p>รวมลิงก์ข้อมูลจากต้นทางโรงเรียน โดยไม่บล็อกการใช้งานของระบบติดตามงาน</p></article><article class="card"><span class="card-kicker">TUPP</span><h3>บริการนักเรียน</h3><p>เข้าสู่พื้นที่งานของตัวเองจากเมนูด้านบน โดยข้อมูลส่วนตัวแยกจากหน้าเว็บสาธารณะ</p></article><article class="card"><span class="card-kicker">TUPP</span><h3>โครงการ AI</h3><p>TUPP Homework AI เป็นโครงการต้นแบบสำหรับช่วยการเรียน โดยควบคุมโครงการตามขอบเขตที่กำหนด</p></article></div></section>`}
function tracking(){const now=Date.now();const pending=app.tasks.filter(x=>x.status==='PENDING');return `<section class="page"><div class="section-head"><div><span class="eyebrow">HOMEWORK TRACKING</span><h2>ติดตามงาน</h2><p>หน้าเดียวสำหรับบันทึกงาน ดู Deadline และแยกสถานะส่งแล้ว / ยังไม่ส่ง / เลยกำหนด</p></div><div class="tracking-badge">${pending.length} งานค้าง</div></div><div class="tracking-grid"><form class="panel" id="taskForm"><h3>บันทึกการบ้าน</h3><label>รหัสนักเรียน 5 หลัก<input id="studentId" inputmode="numeric" maxlength="5" value="${esc(app.studentId)}" placeholder="5-digit ID"/></label><label>ชื่องาน<input id="title" required value="${esc(app.form.title)}"/></label><label>วิชา<input id="subject" value="${esc(app.form.subject)}"/></label><label>กำหนดส่ง<input id="dueAt" type="datetime-local" value="${esc(app.form.dueAt)}"/></label><div class="two"><label>ความสำคัญ<select id="priority"><option ${app.form.priority==='NORMAL'?'selected':''}>NORMAL</option><option ${app.form.priority==='HIGH'?'selected':''}>HIGH</option><option ${app.form.priority==='URGENT'?'selected':''}>URGENT</option></select></label><label>คะแนนเต็ม<input id="scoreMax" type="number" min="0" value="${esc(app.form.scoreMax)}"/></label></div><label>หมายเหตุ<textarea id="note">${esc(app.form.note)}</textarea></label><button class="primary">บันทึกงานลง Firebase</button><div class="form-msg">${esc(app.status)}</div></form><div class="panel"><div class="panel-head"><div><h3>สถานะงาน</h3><span class="muted">ข้อมูลล่าสุดจาก Firestore</span></div><button class="ghost" id="refreshTasks">รีเฟรช</button></div><div class="stat-row"><div class="stat"><b>${app.tasks.length}</b><span>ทั้งหมด</span></div><div class="stat"><b>${app.tasks.filter(x=>x.status==='SUBMITTED').length}</b><span>ส่งแล้ว</span></div><div class="stat"><b>${pending.length}</b><span>ยังไม่ส่ง</span></div><div class="stat red"><b>${pending.filter(x=>x.dueAt&&new Date(x.dueAt).getTime()<now).length}</b><span>เลยกำหนด</span></div></div><div class="task-list">${app.tasks.map(t=>{const overdue=t.status==='PENDING'&&t.dueAt&&new Date(t.dueAt).getTime()<now;return `<div class="task ${overdue?'overdue':''}"><div><b>${esc(t.title)}</b><span>${esc(t.subject||'ไม่ระบุวิชา')} • ${esc(t.priority||'NORMAL')}</span></div><div class="task-right"><span>${t.status==='SUBMITTED'?'ส่งแล้ว':'ยังไม่ส่ง'}</span><small>${esc(t.dueAt||'ไม่ระบุ Deadline')}</small>${t.status==='PENDING'?`<button class="primary" data-submit-id="${t.id}" style="padding:4px 10px;font-size:11px;margin-top:6px">ส่งงาน</button>`:''}</div></div>`}).join('')||'<div class="empty">ยังไม่มีรายการงานสำหรับรหัสนี้</div>'}</div></div></div></section>`}
function ai(){return `<section class="page ai-page"><div class="section-head"><div><span class="eyebrow">GEMINI POWERED</span><h2>TUPP Homework AI</h2><p>ผู้ช่วยการเรียนไทยเป็นหลัก พร้อมระบบ endpoint แยกจากหน้าเว็บเพื่อไม่ฝัง API key ลงในไฟล์</p></div></div><div class="ai-box"><aside class="ai-side"><h3>AI CORE</h3><p>ช่วยอธิบายบทเรียน แก้โจทย์ วางแนวทางทำการบ้าน และสรุปความรู้</p><div class="note">Endpoint ปัจจุบัน: ${esc(app.geminiEndpoint)}</div><button class="ghost" id="setEndpoint" style="width:100%;margin-top:10px">ตั้งค่า Gemini Endpoint</button></aside><div class="chat"><div class="chat-log" id="chatLog">${app.messages.map(m=>`<div class="bubble ${m.role==='user'?'user':'model'}">${esc(m.text)}</div>`).join('')}</div><div class="chat-input"><textarea id="aiInput" placeholder="พิมพ์คำถาม…"></textarea><button class="primary" id="sendAI">${app.busy?'กำลังคิด…':'ส่ง'}</button></div></div></div></section>`}
function admin(){return `<section class="page"><div class="section-head"><div><span class="eyebrow">ADMIN CONTROL</span><h2>Council Control</h2><p>ศูนย์ควบคุม Firebase, สมาชิก Council, Teacher Tracking และตรวจสุขภาพระบบ</p></div></div><div class="admin-grid"><div class="ops-card"><h3>01 // FIREBASE OPERATIONS</h3><div class="kpi"><div class="kpi-line"><span>Configured</span><b>${state.fb.configured?'YES':'NO'}</b></div><div class="kpi-line"><span>Boot</span><b>${state.fb.booted?'READY':'WAITING'}</b></div><div class="kpi-line"><span>Persistence</span><b>${esc(state.fb.persistence)}</b></div><div class="kpi-line"><span>Listeners</span><b>${state.fb.activeListeners}</b></div><div class="kpi-line"><span>Retries</span><b>${state.fb.retryCount}</b></div></div><button class="gold" id="systemCheck" style="margin-top:12px">SYSTEM CHECK</button><div class="status-box" style="margin-top:10px">${esc(app.status)}</div></div><div class="ops-card"><h3>02 // COUNCIL LEGACY REGISTRY</h3>${LEGACY_COUNCIL_REGISTRY.map(x=>`<div class="registry"><b>${esc(x.email)}</b><span>${esc(x.roles.join(' + '))} • ${esc(x.access.join(' / '))}</span></div>`).join('')}</div><div class="ops-card wide"><h3>03 // FIREBASE CONFIG</h3><div class="config"><input data-cfg="apiKey" placeholder="apiKey" value="${esc(firebaseConfig.apiKey||'')}"/><input data-cfg="authDomain" placeholder="authDomain" value="${esc(firebaseConfig.authDomain||'')}"/><input data-cfg="projectId" placeholder="projectId" value="${esc(firebaseConfig.projectId||'')}"/><input data-cfg="storageBucket" placeholder="storageBucket" value="${esc(firebaseConfig.storageBucket||'')}"/><input data-cfg="messagingSenderId" placeholder="messagingSenderId" value="${esc(firebaseConfig.messagingSenderId||'')}"/><input data-cfg="appId" placeholder="appId" value="${esc(firebaseConfig.appId||'')}"/><button class="primary" id="saveConfig">บันทึก Firebase Config + รีโหลด</button><div class="note">Firebase client config ไม่ใช่ password แต่ Firestore/Auth rules ต้องตั้งให้ปลอดภัยบนโปรเจกต์จริง ส่วน Gemini API key ไม่ควรใส่ใน HTML</div></div></div><div class="ops-card wide"><h3>04 // TEACHER TRACKING</h3><div class="toolbar"><input id="classRoom" placeholder="ม.1/9" value="${esc(app.classRoom)}"/><button class="primary" id="loadClass">LOAD CLASS</button></div><div class="class-list">${app.classTasks.map(t=>`<div class="class-row ${t.status==='PENDING'?'pending':''}"><b>${esc(t.studentId||'-')}</b><span>${esc(t.title)}</span><span>${esc(t.status)}</span><span>${esc(t.dueAt||'-')}</span></div>`).join('')||'<div class="empty">ยังไม่มีข้อมูลห้องนี้</div>'}</div></div></div></section>`}
function authModal(){return `<div class="modal-bg"><div class="modal"><button class="close" id="closeAuth">×</button><div class="tabs"><button class="${app.authMode==='general'?'active':''}" data-auth="general">บุคคลทั่วไป</button><button class="${app.authMode==='council'?'active':''}" data-auth="council">สมาชิกสภา / ADMIN</button></div>${app.authMode==='general'?`<h3>เข้าสู่ระบบผู้ใช้ทั่วไป</h3><p class="muted">ใช้ Firebase Anonymous Authentication เพื่อไม่เก็บรหัสผ่านนักเรียนไว้ในหน้าเว็บ</p><button class="primary full" id="generalLogin">CONTINUE WITH FIREBASE</button>`:`<h3>COUNCIL AUTHENTICATION</h3><label class="panel" style="display:block;border:0;box-shadow:none;padding:0">EMAIL<input id="loginEmail" value="${esc(LEGACY_COUNCIL_REGISTRY[0]?.email||'')}"/></label><label class="panel" style="display:block;border:0;box-shadow:none;padding:0">PASSWORD<input id="loginPw" type="password"/></label><button class="gold full" id="councilLogin">SECURE COUNCIL LOGIN</button><button class="ghost full" id="googleAdminLogin" style="margin-top:8px">SIGN IN WITH GOOGLE (ADMIN)</button><div class="note">บัญชี Council ต้องมี Firebase Authentication account และ Council Directory record ก่อนใช้งานจริง</div>`}<div class="form-msg">${esc(app.status)}</div></div></div>`}
function shell(){const adminAllowed=Boolean(app.member&&app.member.active!==false);document.getElementById('root').innerHTML=`<div class="app"><header class="top"><div class="brand"><div class="logo"><canvas data-electric></canvas></div><div><div class="brand-title">TUPP AI</div><div class="brand-sub">School Platform • Firebase Core</div></div></div><div class="top-actions"><span class="status-dot ${state.fb.booted?'ok':''}"></span><span class="tiny">FIREBASE ${state.fb.booted?'READY':'NOT CONFIGURED'}</span><button class="admin-entry" id="openCouncil">COUNCIL / ADMIN</button>${app.session?'<button class="ghost" id="logout">ออกจากระบบ</button>':''}</div></header><nav class="nav"><button class="${app.page==='school'?'active':''}" data-page="school"><b>01</b><span>เว็บไซต์โรงเรียน</span></button><button class="${app.page==='tracking'?'active':''}" data-page="tracking"><b>02</b><span>ติดตามงาน</span></button><button class="${app.page==='ai'?'active':''}" data-page="ai"><b>03</b><span>TUPP Homework AI</span></button><button class="${app.page==='admin'?'active':''}" data-page="admin"><b>ADMIN</b><span>Council Control</span></button></nav><main>${app.page==='school'?school():app.page==='tracking'?tracking():app.page==='ai'?ai():(adminAllowed?admin():school())}</main><div class="footer">TUPP AI • Independent project prototype • Firebase-ready • Never place Gemini API keys in this HTML</div>${app.authOpen?authModal():''}</div>`;wire();drawLogos()}
function wire(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{const p=b.dataset.page;if(p==='admin'&&!app.member){app.authMode='council';app.authOpen=true;render();return}nav(p)});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>nav(b.dataset.go));document.getElementById('openCouncil')?.addEventListener('click',()=>{app.authMode='council';app.authOpen=true;app.status='';render()});document.getElementById('logout')?.addEventListener('click',async()=>{try{if(state.auth)await signOut(state.auth)}catch{}app.session=null;app.member=null;nav('school')});document.getElementById('closeAuth')?.addEventListener('click',()=>{app.authOpen=false;render()});document.querySelectorAll('[data-auth]').forEach(b=>b.onclick=()=>{app.authMode=b.dataset.auth;app.status='';render()});document.getElementById('generalLogin')?.addEventListener('click',async()=>{try{app.status='กำลังเข้าสู่ระบบ…';render();const r=await generalLogin();app.session=r.user;app.authOpen=false;app.page='tracking';audit('GENERAL_LOGIN').catch(()=>{});app.status='เข้าสู่ระบบผู้ใช้ทั่วไปแล้ว';render()}catch(e){app.status=e.message;render()}});document.getElementById('googleAdminLogin')?.addEventListener('click',async()=>{try{app.status='กำลังเข้าสู่ระบบด้วย Google…';render();const r=await googleAdminLogin();app.session=r.user;app.member=r.member;app.authOpen=false;app.page='admin';audit('ADMIN_GOOGLE_LOGIN',{email:r.member.email});app.status='ADMIN ACCESS GRANTED';render()}catch(x){app.status=x.message;render()}});document.getElementById('councilLogin')?.addEventListener('click',async()=>{const e=document.getElementById('loginEmail').value,p=document.getElementById('loginPw').value;try{app.status='กำลังตรวจสอบ Council + Firebase Auth…';render();const r=await councilLogin(e,p);app.session=r.user;app.member=r.member;app.authOpen=false;app.page='admin';audit('COUNCIL_LOGIN',{email:e,roles:r.member.roles||[]});app.status='COUNCIL ACCESS GRANTED';render()}catch(x){app.status=x.message;render()}});document.getElementById('taskForm')?.addEventListener('submit',async e=>{e.preventDefault();app.studentId=(document.getElementById('studentId').value||'').replace(/\D/g,'').slice(0,5);localStorage.setItem('tupp_ai_student_id',app.studentId);if(!app.session){app.status='กรุณาเข้าสู่ระบบผู้ใช้ทั่วไปก่อน';render();return}if(!/^\d{5}$/.test(app.studentId)){app.status='รหัสนักเรียนต้องเป็นตัวเลข 5 หลัก';render();return}app.form={title:document.getElementById('title').value,subject:document.getElementById('subject').value,dueAt:document.getElementById('dueAt').value,priority:document.getElementById('priority').value,scoreMax:document.getElementById('scoreMax').value,note:document.getElementById('note').value};try{await addHomework({...app.form,studentId:app.studentId,scoreMax:Number(app.form.scoreMax||0),classRoom:'',status:'PENDING',createdBy:app.session.uid});app.status='บันทึกการบ้านลง Firebase แล้ว';await loadTasks();app.form={title:'',subject:'',dueAt:'',priority:'NORMAL',scoreMax:'10',note:''};render()}catch(x){app.status=x.message;render()}});document.getElementById('refreshTasks')?.addEventListener('click',loadTasks);
document.querySelectorAll('[data-submit-id]').forEach(b=>b.onclick=async()=>{const id=b.dataset.submitId;try{app.status='กำลังส่งงาน...';render();await updateTaskStatus(id,'SUBMITTED');app.status='ส่งงานเรียบร้อยแล้ว';await loadTasks();}catch(e){app.status=e.message;render()}});document.getElementById('sendAI')?.addEventListener('click',sendAI);document.getElementById('aiInput')?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendAI()}});document.getElementById('setEndpoint')?.addEventListener('click',()=>{const v=prompt('Gemini endpoint',app.geminiEndpoint);if(v){app.geminiEndpoint=v;render()}});document.getElementById('systemCheck')?.addEventListener('click',async()=>{try{app.status='กำลังตรวจระบบ…';render();const r=await health();app.status=`Health document: ${r.healthDocument?'FOUND':'NOT FOUND'} • ${r.latency} ms`;render()}catch(e){app.status=e.message;render()}});document.getElementById('saveConfig')?.addEventListener('click',()=>{document.querySelectorAll('[data-cfg]').forEach(i=>firebaseConfig[i.dataset.cfg]=i.value.trim());saveCfg();state.app=state.auth=state.db=null;state.fb={configured:firebaseConfigured(),booted:false,persistence:'not-initialized',retryCount:0,lastError:'',lastSuccessAt:null,activeListeners:0};app.status='บันทึก Config แล้ว — กดรีโหลดหน้าเพื่อเริ่ม Firebase';render()});document.getElementById('loadClass')?.addEventListener('click',async()=>{app.classRoom=document.getElementById('classRoom').value.trim();try{app.classTasks=await listClass(app.classRoom);app.status=`โหลด ${app.classTasks.length} รายการ`;render()}catch(e){app.status=e.message;render()}})}
async function loadTasks(){try{app.tasks=await listHomework();render()}catch(e){app.status=e.message;render()}}
async function sendAI(){if(app.busy)return;const input=document.getElementById('aiInput');const q=(input?.value||'').trim();if(!q)return;app.messages.push({role:'user',text:q});app.busy=true;render();try{const r=await fetch(app.geminiEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:app.messages.map(m=>({role:m.role==='model'?'model':'user',parts:[{text:m.text}]}))})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`Gemini request failed (${r.status})`);app.messages.push({role:'model',text:d.text||'Gemini ไม่ได้ส่งข้อความตอบกลับ'});}catch(e){app.messages.push({role:'model',text:`เชื่อม Gemini ไม่สำเร็จ: ${e.message}`})}finally{app.busy=false;render();setTimeout(()=>document.getElementById('chatLog')?.scrollTo({top:999999,behavior:'smooth'}),20)}}
function drawLogos(){document.querySelectorAll('canvas[data-electric]').forEach(c=>{const ctx=c.getContext('2d');let dpr=devicePixelRatio||1;let raf;function fit(){const r=c.getBoundingClientRect();c.width=r.width*dpr;c.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}fit();let t=0;function frame(){t+=.025;const r=c.getBoundingClientRect(),w=r.width,h=r.height;ctx.clearRect(0,0,w,h);const cx=w/2,cy=h/2,s=Math.min(w,h);for(let k=0;k<6;k++){ctx.beginPath();for(let i=0;i<=220;i++){const a=i/220*Math.PI*2;const rr=s*(.25+.07*Math.sin(a*5+t*2+k*.7))+k*.5;const x=cx+Math.cos(a+t*.2+k)*rr;const y=cy+Math.sin(a+t*.2+k)*rr;const g=2.2*Math.sin(a*9+t*3+k)+Math.sin(a*17-t*2);const xx=x+g,yy=y+Math.cos(a*11+t+k)*2; i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.strokeStyle=k%2?'rgba(239,58,151,.33)':'rgba(22,136,255,.45)';ctx.lineWidth=1.3;ctx.stroke()}ctx.beginPath();ctx.arc(cx,cy,s*.22,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;ctx.stroke();raf=requestAnimationFrame(frame)}frame();window.addEventListener('resize',fit,{passive:true});c._electricStop=()=>cancelAnimationFrame(raf)})}
function render(){shell()}
render();
if(firebaseConfigured()){initFirebase().then(()=>{loadTasks();}).catch(e=>{state.fb.lastError=e.message;render()});}
</script>
</body>

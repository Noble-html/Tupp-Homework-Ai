/* TUPP Homework AI only — premium NVIDIA-inspired visual system.

async function listHomework(studentId){await initFirebase();const q=query(collection(state.db,'homework'),where('studentId','==',studentId),limit(200));return new Promise((resolve,reject)=>{const stop=onSnapshot(q,s=>{state.fb.lastSuccessAt=Date.now();resolve(s.docs.map(d=>({id:d.id,...d.data()})))},e=>{state.fb.lastError=e.message;reject(e)});state.listeners.add(stop);state.fb.activeListeners=state.listeners.size})}
async function addHomework(data){await initFirebase();return retry(()=>addDoc(collection(state.db,'homework'),{...data,createdAt:serverTimestamp(),updatedAt:serverTimestamp()}))}
async function listClass(classRoom){await initFirebase();const q=query(collection(state.db,'homework'),where('classRoom','==',classRoom),limit(500));return new Promise((resolve,reject)=>{const stop=onSnapshot(q,s=>resolve(s.docs.map(d=>({id:d.id,...d.data()}))),reject);state.listeners.add(stop);state.fb.activeListeners=state.listeners.size})}
async function health(){await initFirebase();const t=performance.now();const s=await retry(()=>getDoc(doc(state.db,'system','health')));return{latency:Math.round(performance.now()-t),healthDocument:s.exists()}}

async function sendAI(){
 if(app.busy)return;const input=document.getElementById('aiInput');const q=(input?.value||'').trim();if(!q)return;
 const user=state.auth?.currentUser;if(!user){app.status='กรุณาเข้าสู่ระบบด้วย Google ก่อนใช้ AI';app.messages.push({role:'model',text:'กรุณาเข้าสู่ระบบด้วยบัญชี Google ของโรงเรียน (@tupp.ac.th) ก่อนใช้งาน AI'});render();return}
 app.messages.push({role:'user',text:q});app.busy=true;render();
 try{
  const token=await user.getIdToken();
  const r=await fetch(app.aiEndpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({model:app.selectedModel,mode:app.aiMode==='chat'?'chat':'reasoning',messages:app.messages.filter(m=>m.text).map(m=>({role:m.role==='user'?'user':'assistant',content:m.text}))})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw Error(d.error||`Gemini request failed (${r.status})`);
  app.messages.push({role:'model',text:(d.text||'Gemini ไม่ได้ส่งข้อความตอบกลับ')+`\n\n[${d.model||app.selectedModel} • ${app.aiMode}]`});
 }
 catch(e){app.messages.push({role:'model',text:`เชื่อมต่อ Gemini ไม่สำเร็จ: ${e.message}`})}
 finally{app.busy=false;render();setTimeout(()=>document.getElementById('chatLog')?.scrollTo({top:999999,behavior:'smooth'}),20)}
}
function drawLogos(){document.querySelectorAll('canvas[data-electric]').forEach(c=>{const ctx=c.getContext('2d');let dpr=devicePixelRatio||1;let raf;function fit(){const r=c.getBoundingClientRect();c.width=r.width*dpr;c.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}fit();let t=0;function frame(){t+=.025;const r=c.getBoundingClientRect(),w=r.width,h=r.height;ctx.clearRect(0,0,w,h);const cx=w/2,cy=h/2,s=Math.min(w,h);for(let k=0;k<6;k++){ctx.beginPath();for(let i=0;i<=220;i++){const a=i/220*Math.PI*2;const rr=s*(.25+.07*Math.sin(a*5+t*2+k))+k*.5;const x=cx+Math.cos(a+t*.2+k)*rr;const y=cy+Math.sin(a+t*.2+k)*rr;const g=2.2*Math.sin(a*9+t*3+k)+Math.sin(a*17-t*2);const xx=x+g,yy=y+Math.cos(a*11+t+k)*2; i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.strokeStyle=k%2?'rgba(239,58,151,.33)':'rgba(22,136,255,.45)';ctx.lineWidth=1.3;ctx.stroke()}ctx.beginPath();ctx.arc(cx,cy,s*.22,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;ctx.stroke();raf=requestAnimationFrame(frame)}frame();window.addEventListener('resize',fit,{passive:true});c._electricStop=()=>cancelAnimationFrame(raf)})}

async function registerSchoolAccount({role,email,password,id,displayName,inviteToken='',bootstrapSecret=''}){
 await initFirebase();
 const cleanEmail=String(email||'').trim().toLowerCase();
 if(!/^\S+@\S+\.\S+$/.test(cleanEmail))throw Error('กรุณากรอกอีเมลที่ถูกต้อง');
 if(password.length<8)throw Error('รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร');
 if(role==='student'){
  if(!/@tupp\.ac\.th$/.test(cleanEmail))throw Error('อีเมลนักเรียนต้องลงท้ายด้วย @tupp.ac.th');
  if(!/^\d{5}$/.test(id))throw Error('รหัสนักเรียนต้องเป็นตัวเลข 5 หลัก');
  const cred=await retry(()=>createUserWithEmailAndPassword(state.auth,cleanEmail,password));
  try{await retry(()=>runTransaction(state.db,async tx=>{const idRef=doc(state.db,'studentIds',id);const existing=await tx.get(idRef);if(existing.exists())throw Error('รหัสนักเรียนนี้ถูกใช้ลงทะเบียนแล้ว');tx.set(idRef,{uid:cred.user.uid,createdAt:serverTimestamp()});tx.set(doc(state.db,'profiles',cred.user.uid),{uid:cred.user.uid,email:cleanEmail,role:'student',studentId:id,createdAt:serverTimestamp(),updatedAt:serverTimestamp()})}));}
  catch(e){try{await deleteUser(cred.user)}catch{}throw e}
  return {user:cred.user,profile:{uid:cred.user.uid,email:cleanEmail,role:'student',studentId:id}};
 }
 if(role==='teacher'){
  if(!/^\d{5}$/.test(id))throw Error('รหัสประจำตัวครูต้องเป็นตัวเลข 5 หลัก');
  const parts=String(displayName||'').trim().split(/\s+/);const firstName=parts.shift()||'';const lastName=parts.join(' ');
  if(!firstName||!lastName)throw Error('กรุณากรอกชื่อและนามสกุลให้ครบ');
  const cred=await retry(()=>createUserWithEmailAndPassword(state.auth,cleanEmail,password));
  try{await retry(()=>runTransaction(state.db,async tx=>{const idRef=doc(state.db,'teacherIds',id);const existing=await tx.get(idRef);if(existing.exists())throw Error('รหัสประจำตัวครูนี้ถูกใช้ลงทะเบียนแล้ว');tx.set(idRef,{uid:cred.user.uid,createdAt:serverTimestamp()});tx.set(doc(state.db,'profiles',cred.user.uid),{uid:cred.user.uid,email:cleanEmail,role:'teacher_pending',teacherId:id,firstName,lastName,createdAt:serverTimestamp(),updatedAt:serverTimestamp()})}));}
  catch(e){try{await deleteUser(cred.user)}catch{}throw e}
  return {user:cred.user,profile:{uid:cred.user.uid,email:cleanEmail,role:'teacher_pending',teacherId:id,firstName,lastName}};
 }
 if(role==='admin'){
  if(!inviteToken&&!bootstrapSecret)throw Error('ต้องใช้ลิงก์เชิญแอดมินหรือรหัสเปิดระบบครั้งแรก');
  const cred=await retry(()=>createUserWithEmailAndPassword(state.auth,cleanEmail,password));
  try{await adminApi(inviteToken?'redeem':'bootstrap',{email:cleanEmail,inviteToken},bootstrapSecret);}
  catch(e){try{await deleteUser(cred.user)}catch{}throw e}
  const snap=await retry(()=>getDoc(doc(state.db,'councilMembers',cred.user.uid)));
  return {user:cred.user,member:snap.exists()?{id:snap.id,...snap.data()}:null,profile:null};
 }
 throw Error('ประเภทบัญชีไม่ถูกต้อง');
}
async function schoolAccountLogin(email,password){
 await initFirebase();
 const cred=await retry(()=>signInWithEmailAndPassword(state.auth,email.trim().toLowerCase(),password));
 const [councilSnap,profileSnap]=await Promise.all([retry(()=>getDoc(doc(state.db,'councilMembers',cred.user.uid))),retry(()=>getDoc(doc(state.db,'profiles',cred.user.uid)))]);
 if(councilSnap.exists()){
  const m={id:councilSnap.id,...councilSnap.data()};
  if(m.active!==true||!Array.isArray(m.roles)||!m.roles.some(r=>['CAO','ADMIN','DCAO','SCAO','HSA'].includes(r))){await signOut(state.auth);throw Error('บัญชี Council ถูกระงับหรือไม่มีสิทธิ์')}
  return {user:cred.user,member:m,profile:profileSnap.exists()?{id:profileSnap.id,...profileSnap.data()}:null};
 }
 if(!profileSnap.exists()){await signOut(state.auth);throw Error('ไม่พบบัญชีผู้ใช้ที่เปิดใช้งานใน TUPP Homework AI')}
 const profile={id:profileSnap.id,...profileSnap.data()};
 if(profile.role==='teacher_pending'){await signOut(state.auth);throw Error('บัญชีครูอยู่ระหว่างรออนุมัติจากผู้ดูแล')}
 if(!['student','teacher'].includes(profile.role)){await signOut(state.auth);throw Error('บัญชีนี้ยังไม่มีสิทธิ์ใช้งาน')}
 return {user:cred.user,profile,member:null};
}
async function adminApi(action,payload={},bootstrapSecret='',recoverySecret=''){
 const user=state.auth?.currentUser;if(!user)throw Error('กรุณาเข้าสู่ระบบก่อน');
 const token=await user.getIdToken(true);const headers={'Content-Type':'application/json','Authorization':`Bearer ${token}`};if(bootstrapSecret)headers['X-Admin-Bootstrap-Secret']=bootstrapSecret;if(recoverySecret)headers['X-Admin-Recovery-Secret']=recoverySecret;
 let response;try{response=await fetch('/api/admin-invites',{method:'POST',headers,body:JSON.stringify({action,...payload})})}catch{throw Error('ติดต่อ Backend /api/admin-invites ไม่ได้ ตรวจว่าโฮสต์มี Serverless API route นี้และ deploy แล้ว')}const data=await response.json().catch(()=>({}));if(!response.ok){if(response.status===404)throw Error('ไม่พบ Backend endpoint /api/admin-invites (อัปโหลด HTML อย่างเดียวไม่สร้าง API ต้อง deploy backend ด้วย)');throw Error(data.error||`Admin API error (${response.status})`)}return data;
}

tracking = function(){const now=Date.now();const pending=app.tasks.filter(x=>x.status==='PENDING');const teacher=app.userProfile?.role==='teacher';return `<section class="page"><div class="section-head"><div><span class="eyebrow">HOMEWORK & REMINDERS</span><h2>บันทึกงานกันลืม / ติดตามงาน</h2><p>นักเรียนใช้จดกำหนดส่งของตนเอง ส่วนคุณครูสามารถมอบหมายงานโดยระบุรหัสนักเรียน 5 หลัก</p></div><button class="ghost" data-page="school">← กลับหน้าหลัก</button></div>${teacher?`<form class="panel" id="teacherTaskForm" style="margin-bottom:18px"><h3>มอบหมายงานสำหรับนักเรียน</h3><div class="two"><label>รหัสนักเรียนเป้าหมาย (5 หลัก)<input id="assignStudentId" required inputmode="numeric" pattern="[0-9]{5}" maxlength="5"/></label><label>ห้องเรียน<input id="assignClass" required placeholder="เช่น ม.1/9"/></label></div><div class="two"><label>ชื่องาน<input id="assignTitle" required maxlength="180"/></label><label>วิชา<input id="assignSubject" maxlength="80"/></label></div><div class="two"><label>กำหนดส่ง<input id="assignDueAt" type="datetime-local" required/></label><label>ความสำคัญ<select id="assignPriority"><option value="NORMAL">ปกติ</option><option value="HIGH">สูง</option><option value="URGENT">เร่งด่วน</option></select></label></div><label>รายละเอียด / คำชี้แจง<textarea id="assignNote" maxlength="2500"></textarea></label><button class="primary">บันทึกและมอบหมายงาน</button><div class="form-msg" id="teacherTaskMsg" role="status"></div></form>`:''}<div class="tracking-grid"><form class="panel" id="taskForm"><h3>บันทึกงานกันลืมส่วนตัว</h3><label>รหัสนักเรียน 5 หลัก<input id="studentId" inputmode="numeric" maxlength="5" value="${esc(app.studentId)}" placeholder="รหัส 5 หลัก"/></label><label>ชื่องาน<input id="title" required value="${esc(app.form.title)}"/></label><label>วิชา<input id="subject" value="${esc(app.form.subject)}"/></label><label>กำหนดส่ง<input id="dueAt" type="datetime-local" value="${esc(app.form.dueAt)}"/></label><div class="two"><label>ความสำคัญ<select id="priority"><option ${app.form.priority==='NORMAL'?'selected':''} value="NORMAL">ปกติ</option><option ${app.form.priority==='HIGH'?'selected':''} value="HIGH">สูง</option><option ${app.form.priority==='URGENT'?'selected':''} value="URGENT">เร่งด่วน</option></select></label><label>คะแนนเต็ม<input id="scoreMax" type="number" min="0" value="${esc(app.form.scoreMax)}"/></label></div><label>หมายเหตุ<textarea id="note">${esc(app.form.note)}</textarea></label><button class="primary">บันทึกงาน</button><div class="form-msg">${esc(app.status)}</div></form><div class="panel"><div class="panel-head"><div><h3>สถานะงาน</h3><span class="muted">งานที่เชื่อมกับรหัสนักเรียน</span></div><button class="ghost" id="refreshTasks">รีเฟรช</button></div><div class="stat-row"><div class="stat"><b>${app.tasks.length}</b><span>ทั้งหมด</span></div><div class="stat"><b>${app.tasks.filter(x=>x.status==='SUBMITTED').length}</b><span>ส่งแล้ว</span></div><div class="stat"><b>${pending.length}</b><span>ยังไม่ส่ง</span></div><div class="stat red"><b>${pending.filter(x=>x.dueAt&&new Date(x.dueAt).getTime()<now).length}</b><span>เลยกำหนด</span></div></div><div class="task-list">${app.tasks.map(t=>{const overdue=t.status==='PENDING'&&t.dueAt&&new Date(t.dueAt).getTime()<now;return `<div class="task ${overdue?'overdue':''}"><div><b>${esc(t.title)}</b><span>${esc(t.subject||'ไม่ระบุวิชา')} • ${esc(t.priority||'NORMAL')} • ${esc(t.classRoom||'งานส่วนตัว')}</span></div><div class="task-right"><span>${t.status==='SUBMITTED'?'ส่งแล้ว':'ยังไม่ส่ง'}</span><small>${esc(t.dueAt||'ไม่ระบุ Deadline')}</small></div></div>`}).join('')||'<div class="empty">ยังไม่มีรายการงานสำหรับรหัสนี้</div>'}</div></div></div></section>`};
function accountPage(){return `<section class="page"><div class="section-head"><div><span class="eyebrow">ACCOUNT & ACCESS</span><h2>บัญชีผู้ใช้งาน</h2><p>ระบบบัญชีแยกบทบาท นักเรียน · ครู · Council / Admin</p></div><button class="ghost" data-page="school">← กลับหน้าหลัก</button></div><div class="tracking-grid"><form class="panel" id="registerSchoolForm"><h3>สร้างบัญชีใหม่</h3><label>ประเภทบัญชี<select id="regRole"><option value="student">นักเรียน</option><option value="teacher">คุณครู (รออนุมัติ)</option><option value="admin">Council / Admin (ใช้คำเชิญหรือรหัสเริ่มต้น)</option></select></label><label>อีเมล<input id="regEmail" type="email" required autocomplete="email" placeholder="name@tupp.ac.th"/></label><label>รหัสนักเรียน / รหัสครู (5 หลัก — เฉพาะนักเรียนและครู)<input id="regId" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" placeholder="เช่น 12345"/></label><label>ชื่อและนามสกุล (เฉพาะครู)<input id="regName" maxlength="100" placeholder="ชื่อ นามสกุล"/></label><label>รหัสผ่าน (อย่างน้อย 8 ตัว)<input id="regPassword" required type="password" minlength="8" autocomplete="new-password"/></label><label>ยืนยันรหัสผ่าน<input id="regPassword2" required type="password" minlength="8" autocomplete="new-password"/></label><label>Admin invite token (เฉพาะแอดมิน หากได้รับเชิญ)<input id="regInviteToken" autocomplete="off" placeholder="วาง token จากลิงก์เชิญ"/></label><label>รหัสเปิดระบบ Admin ครั้งแรก (ใช้เฉพาะตั้งค่าแอดมินคนแรก)<input id="regBootstrapSecret" type="password" autocomplete="off" placeholder="ใช้รหัสที่ตั้งไว้ฝั่งเซิร์ฟเวอร์เท่านั้น"/></label><button type="submit" class="primary full">ลงทะเบียน</button><div id="registerMsg" class="form-msg" role="status"></div><div class="note">รหัส Gemini, service account และรหัสตั้งค่าผู้ดูแลต้องอยู่ฝั่งเซิร์ฟเวอร์ ห้ามใส่ API key ลงในหน้าเว็บ</div></form><form class="panel" id="schoolLoginForm"><h3>เข้าสู่ระบบ</h3><label>อีเมล<input id="loginEmail" type="email" required autocomplete="username" placeholder="อีเมลที่ลงทะเบียน"/></label><label>รหัสผ่าน<input id="loginPassword" type="password" required autocomplete="current-password"/></label><button type="submit" class="gold full">เข้าสู่ระบบอย่างปลอดภัย</button><div id="schoolLoginMsg" class="form-msg" role="status"></div><div class="note">ครูจะเข้าใช้งานได้หลังผู้ดูแลอนุมัติแล้ว ส่วน Council / Admin ต้องมีสิทธิ์ในไดเรกทอรีของระบบ</div></form></div></section>`}

function issuesPage(){const recent=readIssues().slice(0,6);return `<section class="page"><div class="section-head"><div><span class="eyebrow">CRT-AI • ERROR REPORT STATION</span><h2>ศูนย์รายงานปัญหา</h2><p>สถานีรายงานข้อผิดพลาดและรับความคิดเห็นของโครงการ TUPP Homework AI ภายใต้กรอบโครงการสภา CRT-AI</p></div><button class="ghost" data-page="school">← กลับหน้าหลัก</button></div><div class="cards"><article class="card"><span class="card-kicker">01 / REPORT</span><h3>รายงานปัญหา</h3><p>แจ้งอาการ ขอบเขตผลกระทบ เวลาเริ่มพบ และข้อมูลประกอบที่จำเป็น</p></article><article class="card"><span class="card-kicker">02 / FEEDBACK</span><h3>ส่งความคิดเห็น</h3><p>ข้อเสนอแนะเพื่อปรับปรุงประสบการณ์ใช้งาน ไม่จำเป็นต้องแนบข้อมูลส่วนบุคคล</p></article><article class="card"><span class="card-kicker">03 / TRACK</span><h3>ติดตามสถานะ</h3><p>เก็บหมายเลขอ้างอิงไว้เพื่อตรวจสอบสถานะรายงานบนอุปกรณ์นี้</p></article></div><div class="tracking-grid" style="margin-top:18px"><form class="panel" id="issueForm"><h3>แบบฟอร์มแจ้งปัญหา / ความคิดเห็น</h3><label>หัวข้อเรื่อง<input id="issueTitle" required maxlength="140" placeholder="สรุปปัญหาที่พบ"/></label><div class="two"><label>ประเภท<select id="issueType"><option>ข้อผิดพลาดของระบบ</option><option>บัญชี / การเข้าสู่ระบบ</option><option>การบ้าน / ติดตามงาน</option><option>AI / คำตอบไม่ถูกต้อง</option><option>ความเป็นส่วนตัว / ความปลอดภัย</option><option>ข้อเสนอแนะ</option><option>อื่น ๆ</option></select></label><label>ระดับความรุนแรง<select id="issueSeverity"><option value="low">ต่ำ — กระทบเล็กน้อย</option><option value="medium" selected>ปานกลาง — งานบางส่วนติดขัด</option><option value="high">สูง — ฟังก์ชันสำคัญใช้ไม่ได้</option><option value="critical">วิกฤต — ความปลอดภัยหรือข้อมูลเสี่ยง</option></select></label></div><div class="two"><label>ระยะเวลาที่พบ<select id="issueDuration"><option>เพิ่งพบ</option><option>น้อยกว่า 1 ชั่วโมง</option><option>1–24 ชั่วโมง</option><option>1–3 วัน</option><option>มากกว่า 3 วัน</option><option>เกิดซ้ำเป็นระยะ</option></select></label><label>วันและเวลาที่พบ<input id="issueWhen" type="datetime-local" required/></label></div><label>รายละเอียด / ขั้นตอนที่ทำให้เกิดปัญหา<textarea id="issueDetails" required maxlength="4000" placeholder="เกิดอะไรขึ้น เห็นข้อความใดและลองทำขั้นตอนใดแล้ว (อย่าใส่รหัสผ่านหรือข้อมูลลับ) "></textarea></label><label>ความคิดเห็นเพิ่มเติม (ไม่บังคับ)<textarea id="issueComments" maxlength="2500" placeholder="ข้อมูลอื่นที่จำเป็นต่อการตรวจสอบ"></textarea></label><label>ส่งถึง<select id="issueRecipient"><option value="ocao">OCAO / ผู้ดูแลโครงการ</option><option value="owners">เจ้าของโครงการ 4 บัญชี</option></select></label><label style="display:flex;gap:10px;align-items:flex-start;font-weight:600"><input id="issuePrivacyAck" type="checkbox" required style="width:auto;margin:3px 0 0"/>ฉันตรวจสอบแล้วว่าไม่ได้ใส่รหัสผ่าน ข้อมูลสุขภาพ เลขประจำตัวประชาชน หรือข้อมูลของผู้อื่นที่ไม่จำเป็น</label><button class="primary full">ส่งรายงานและสร้างหมายเลขติดตาม</button><div class="form-msg" id="issueMsg" role="status"></div></form><div class="panel"><h3>ติดตามสถานะรายงาน</h3><form id="issueTrackForm"><label>หมายเลขรายงาน<input id="issueTrackId" required placeholder="เช่น CRT-..." value="${esc(app.issueQuery)}"/></label><button class="gold full">ค้นหาสถานะ</button></form><div id="issueTrackResult" class="note" aria-live="polite">${app.issueStatusResult?esc(app.issueStatusResult):'เมื่อส่งรายงานสำเร็จ ระบบจะแสดงหมายเลขอ้างอิงและบันทึกไว้ในอุปกรณ์นี้'}</div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>รายงานล่าสุดบนอุปกรณ์นี้</h3>${recent.map(x=>`<div class="registry"><b>${esc(x.ticket)} · ${esc(x.title)}</b><span>${esc(x.status)} • ${esc(x.createdLocal)}</span></div>`).join('')||'<div class="empty">ยังไม่มีรายงานที่บันทึกไว้บนอุปกรณ์นี้</div>'}<div class="note">การบันทึกในอุปกรณ์นี้ไม่เท่ากับการรับเรื่องจากผู้ดูแล ระบบ Firebase จะบันทึกส่วนกลางได้เมื่อมีการตั้งค่าและกฎอนุญาตแล้ว</div></div></div><div class="panel" style="margin-top:18px"><h3>ช่องแจ้งเตือน — สถานีรายงานข้อผิดพลาด (ภาษาไทย)</h3><p>โปรดเก็บหมายเลขรายงานไว้ ระบบจะแสดงข้อความยืนยันเมื่อบันทึกได้ หากพบเหตุที่เกี่ยวข้องกับความปลอดภัยหรือข้อมูลส่วนบุคคล ให้หลีกเลี่ยงการส่งข้อมูลอ่อนไหวเพิ่ม และส่งเฉพาะรายละเอียดที่จำเป็น</p><div class="note">ผู้รับเรื่องตามที่เลือก: OCAO / เจ้าของโครงการ 4 บัญชี — ${OWNER_EMAILS.map(esc).join(' • ')}</div></div></section>`}
function legalPage(){return `<section class="page"><div class="section-head"><div><span class="eyebrow">CRT-AI • PRIVACY & LEGAL</span><h2>กฎหมายและการคุ้มครองข้อมูล</h2><p>เอกสารประกอบสำหรับโครงการ TUPP Homework AI โดยสรุปหลักกฎหมายที่เกี่ยวข้องและแนวทางใช้งานอย่างรับผิดชอบ</p></div><button class="ghost" data-page="school">← กลับหน้าหลัก</button></div><div class="panel legal"><h3>ประกาศสำคัญก่อนใช้งาน</h3><p><b>สถานะของเอกสาร:</b> ข้อความนี้เป็นข้อมูลทั่วไปเพื่อช่วยให้เข้าใจประเด็นกฎหมาย ไม่ใช่คำปรึกษากฎหมาย ไม่ใช่ประกาศความเป็นส่วนตัวฉบับที่ผ่านการรับรองจากโรงเรียน และไม่ได้หมายความว่า CRT-AI เป็นหน่วยงานราชการหรือผู้ควบคุมข้อมูลของโรงเรียนโดยอัตโนมัติ ผู้จัดทำระบบต้องระบุผู้ควบคุมข้อมูล ผู้ประมวลผล ช่องทางติดต่อ วัตถุประสงค์ ฐานกฎหมาย และระยะเวลาเก็บรักษาที่แท้จริงก่อนเปิดใช้งานจริง</p><h3>1. พระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562 (PDPA)</h3><p>ข้อมูลส่วนบุคคลคือข้อมูลที่ทำให้ระบุตัวบุคคลได้ไม่ว่าทางตรงหรือทางอ้อม รหัสนักเรียน ชื่อ ห้องเรียน ประวัติการส่งงาน บันทึกการใช้งาน หมายเลขรายงานปัญหา และข้อมูลบัญชีอาจเป็นข้อมูลส่วนบุคคลเมื่อเชื่อมโยงถึงบุคคลได้ การนำข้อมูลเหล่านี้มาเก็บ ใช้ เปิดเผย หรือส่งต่อจึงควรทำอย่างมีวัตถุประสงค์ชัดเจน จำกัดเท่าที่จำเป็นและแจ้งให้ผู้ใช้ทราบอย่างโปร่งใส</p><p>มาตรา 22 วางหลักให้เก็บข้อมูลเท่าที่จำเป็นต่อวัตถุประสงค์ที่ชอบด้วยกฎหมาย ส่วนมาตรา 23 กล่าวถึงการแจ้งรายละเอียดก่อนหรือขณะเก็บข้อมูล เช่น วัตถุประสงค์ ประเภทข้อมูล ระยะเวลาเก็บ ผู้รับข้อมูล ช่องทางติดต่อ และสิทธิของเจ้าของข้อมูล ในกรณีที่กฎหมายกำหนด ข้อมูลไม่ควรถูกเก็บเพียงเพราะระบบทำได้ และไม่ควรใช้ข้อมูลที่รวบรวมเพื่อการติดตามการบ้านไปทำวัตถุประสงค์อื่นโดยไม่ตรวจสอบฐานกฎหมายและหน้าที่แจ้งข้อมูลให้เหมาะสม</p><p>การประมวลผลข้อมูลต้องมีฐานทางกฎหมายที่ถูกต้องตามสถานการณ์ ไม่ใช่ทุกกรณีต้องใช้ความยินยอม และไม่ใช่การกดปุ่มยอมรับครั้งเดียวจะทำให้การใช้ข้อมูลทุกอย่างชอบด้วยกฎหมาย ผู้รับผิดชอบควรพิจารณาว่าจำเป็นต่อสัญญา ภารกิจเพื่อประโยชน์สาธารณะ ประโยชน์โดยชอบด้วยกฎหมาย หรือฐานอื่นที่กฎหมายกำหนดหรือไม่ โดยคำนึงถึงอายุและสถานะของผู้ใช้ หากเป็นผู้เยาว์ต้องพิจารณาหลักเกณฑ์เรื่องความสามารถและความยินยอมที่เกี่ยวข้องเป็นพิเศษ</p><p>ข้อมูลส่วนบุคคลที่มีความอ่อนไหวตามมาตรา 26 เช่น ข้อมูลสุขภาพ ความพิการ ชีวมิติ ศาสนา หรือข้อมูลอื่นตามที่กฎหมายระบุ ต้องได้รับการดูแลเข้มงวดเป็นพิเศษ ไม่ควรให้แบบฟอร์มรายงานปัญหาขอข้อมูลดังกล่าวหากไม่จำเป็นอย่างยิ่ง ห้ามส่งรหัสผ่าน โทเคนเข้าระบบ ข้อมูลทางการเงิน หรือข้อมูลส่วนตัวของบุคคลอื่นในช่องความคิดเห็น</p><h3>2. สิทธิของเจ้าของข้อมูล</h3><p>ภายใต้เงื่อนไขและข้อยกเว้นของกฎหมาย เจ้าของข้อมูลอาจมีสิทธิขอเข้าถึงหรือรับสำเนาข้อมูล ขอรับข้อมูลในรูปแบบที่กฎหมายกำหนด คัดค้านการประมวลผล ขอให้ลบ ทำลาย หรือทำให้ไม่สามารถระบุตัวบุคคล ขอให้ระงับการใช้ ขอแก้ไขข้อมูลให้ถูกต้อง และร้องเรียนต่อหน่วยงานที่มีอำนาจ การใช้สิทธิต้องตรวจสอบตัวตนอย่างเหมาะสมและไม่เปิดเผยข้อมูลของบุคคลอื่น การลบข้อมูลอาจมีข้อยกเว้นตามกฎหมายหรือหน้าที่การเก็บรักษา</p><p>ระบบที่ใช้งานจริงควรมีช่องทางขอใช้สิทธิและผู้รับผิดชอบที่ระบุชัดเจน พร้อมกระบวนการยืนยันคำขอ บันทึกการดำเนินการ และตอบกลับภายในระยะเวลาตามกฎหมายที่เกี่ยวข้อง อย่าใส่ที่อยู่อีเมลส่วนตัวของผู้ดูแลเป็นช่องทางอย่างเป็นทางการจนกว่าจะได้รับอนุญาตและกำหนดผู้รับผิดชอบจริง</p><h3>3. ความมั่นคงปลอดภัยและเหตุละเมิดข้อมูล</h3><p>ผู้รับผิดชอบระบบควรใช้มาตรการที่เหมาะสมเพื่อป้องกันการเข้าถึง แก้ไข เปิดเผย สูญหาย หรือทำลายข้อมูลโดยไม่ได้รับอนุญาต เช่น จำกัดสิทธิ์ตามบทบาท ตรวจสอบสิทธิ์ฝั่งเซิร์ฟเวอร์ ใช้การเชื่อมต่อเข้ารหัส ไม่เปิดฐานข้อมูลสาธารณะ จัดการรหัสผ่านผ่านระบบยืนยันตัวตนที่ได้มาตรฐาน บันทึกเหตุการณ์เท่าที่จำเป็น ทบทวนบัญชีผู้ดูแล และมีแผนรับมือเหตุการณ์</p><p>เมื่อสงสัยว่าเกิดเหตุละเมิดข้อมูล ต้องจำกัดความเสียหาย เก็บหลักฐานที่จำเป็น แจ้งผู้รับผิดชอบความปลอดภัย และประเมินหน้าที่แจ้งสำนักงานคณะกรรมการคุ้มครองข้อมูลส่วนบุคคลและเจ้าของข้อมูลตามเงื่อนไขและกรอบเวลาที่กฎหมายกำหนด โดยมาตรา 37 มีหน้าที่บางประการเกี่ยวกับมาตรการความปลอดภัยและการแจ้งเหตุละเมิด การตัดสินใจต้องอิงข้อเท็จจริงและคำแนะนำของผู้รับผิดชอบ ไม่ควรสรุปเองว่าเหตุเล็กน้อยจึงไม่ต้องดำเนินการ</p><h3>4. การเก็บรักษา การเปิดเผย และผู้ให้บริการภายนอก</h3><p>ก่อนใช้ Firebase, Google Gemini หรือบริการคลาวด์อื่นจริง ต้องตรวจสอบข้อกำหนดผู้ การ การอนุมัติใช้งานจริง การกำหนดผู้ควบคุมข้อมูล และการติดต่อหน่วยงานโรงเรียนต้องดำเนินการโดยผู้มีอำนาจตามจริง</p><h3>8. สิ่งที่ต้องทำก่อนเปิดใช้จริง</h3><ol><li>จัดทำ Privacy Notice ที่ระบุผู้ควบคุมข้อมูล ช่องทางติดต่อ ฐานกฎหมาย วัตถุประสงค์ ระยะเวลาเก็บ และผู้รับข้อมูลจริง</li><li>ตั้ง Firebase Authentication และ Firestore Security Rules โดยปฏิเสธการเข้าถึงเป็นค่าเริ่มต้น และตรวจสิทธิ์ในฝั่งเซิร์ฟเวอร์</li><li>ไม่ใช้รหัสนักเรียน 5 หลักเป็นข้อมูลลับเพียงอย่างเดียว เพราะมีจำนวนความเป็นไปได้จำกัด ต้องมีรหัสผ่านและมาตรการป้องกันการเดารหัส</li><li>กำหนดขั้นตอนการกู้คืนบัญชี การปิดบัญชี การลบข้อมูล และการจัดการเหตุละเมิด</li><li>ตรวจสอบการใช้บริการ AI และผู้ให้บริการภายนอกก่อนส่งข้อมูลจริง</li><li>ให้ผู้รับผิดชอบด้านกฎหมาย/ข้อมูลส</p></div></section>`}

 if(isAdminEmail(email)){const r=LEGACY_COUNCIL_REGISTRY.find(x=>x.email.toLowerCase()===email);app.member={id:user.uid,email,roles:r?.roles||['ADMIN'],access:r?.access||[],active:true}}else app.member=null;
 let profile=null;
 try{const s=await getDoc(doc(state.db,'profiles',user.uid));if(s.exists())profile={id:s.id,...s.data()}}catch{}
 const local=email.split('@')[0];
 app.userProfile=profile||{uid:user.uid,email,role:'student',studentId:/^\d{5}$/.test(local)?local:''};
 if(!app.studentId&&app.userProfile.studentId)app.studentId=app.userProfile.studentId;
}
function applyRoute(){if(isAdminPath()){app.page='admin';if(!app.member){app.authMode='council';app.authOpen=true}}}
let authWatcher=false;
async function restoreAuth(){
 if(authWatcher)return;
 try{await initFirebase()}catch{return}
 authWatcher=true;
 onAuthStateChanged(state.auth,async u=>{
  if(!u)return;
  const email=String(u.email||'').toLowerCase();
  if(!u.emailVerified||!isAllowedEmail(email)){try{await signOut(state.auth)}catch{}return}
  if(app.session?.uid===u.uid&&app.userProfile)return;
  await applySession(u);
  if(isAdminPath()&&app.member){app.page='admin';app.authOpen=false}
  render();
 });
}
const _navV51=nav;
nav=function(k){_navV51(k);try{history.replaceState(null,'',k==='admin'?'/admin':'/')}catch{}};
authModal=function(){
 const council=app.authMode==='council';
 return `<div class="modal-bg"><div class="modal"><button class="close" id="closeAuth">×</button><div class="tabs"><button class="${!council?'active':''}" data-auth="general">บุคคลทั่วไป</button><button class="${council?'active':''}" data-auth="council">สมาชิกสภา / ADMIN</button></div>${council?`<h3>COUNCIL / ADMIN</h3><p class="muted">เข้าสู่ระบบด้วย Google เฉพาะบัญชีที่ได้รับอนุญาตเท่านั้น</p><button class="gold full" id="googleLoginCouncil">เข้าสู่ระบบด้วย Google</button>`:`<h3>เข้าสู่ระบบด้วย Google</h3><p class="muted">ใช้บัญชี Google ของโรงเรียน (@tupp.ac.th) เท่านั้น</p><button class="primary full" id="googleLoginGeneral">เข้าสู่ระบบด้วย Google</button>`}<div class="form-msg">${esc(app.status)}</div></div></div>`;
};
accountPage=function(){return `<section class="page"><div class="section-head"><div><span class="eyebrow">ACCOUNT & ACCESS</span><h2>เข้าสู่ระบบ</h2><p>ใช้ Google Sign-in ด้วยบัญชีโรงเรียน (@tupp.ac.th)</p></div><button class="ghost" data-page="school">← กลับหน้าหลัก</button></div><div class="panel"><button class="primary full" id="googleLoginGeneral">เข้าสู่ระบบด้วย Google</button><div class="form-msg">${esc(app.status)}</div></div></section>`};
const _wireV51=wire;
wire=function(){
 _wireV51();
 const go=admin=>async()=>{try{app.status='กำลังเข้าสู่ระบบด้วย Google…';render();const u=await googleSignIn({admin});await applySession(u);app.authOpen=false;app.status='';if(admin&&app.member)app.page='admin';render()}catch(e){app.status=(e?.code==='auth/popup-closed-by-user'||e?.code==='auth/cancelled-popup-request')?'ยกเลิกการเข้าสู่ระบบ':explainFirebaseError(e);render()}};
 document.getElementById('googleLoginGeneral')?.addEventListener('click',go(false));
 document.getElementById('googleLoginCouncil')?.addEventListener('click',go(true));
};

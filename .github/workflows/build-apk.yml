name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install Cordova and Build
        run: |
          npm install -g cordova
          cordova create myapp com.Gsrt07.app "Tupp Ai"
          cd myapp
          cordova platform add android
          # Copy all root files into www/ (including index.html, api/, etc.)
          cp -r ../* www/ || true
          # Fix icon reference if needed or copy the jpg as icon
          if [ -f ../IMG_20261009_210941_373.jpg ]; then
            cp ../IMG_20261009_210941_373.jpg www/icon.jpg
          fi
          cordova build android --debug

      - name: Locate and Copy APK
        run: |
          mkdir -p release-output
          find . -name "*.apk" -exec cp {} release-output/ \;
          ls -la release-output/

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          files: release-output/*.apk
          name: Tupp Ai v1.0.0 Release
          body: Automated build for Tupp Ai (com.Gsrt07.app) with live Firebase Homework Tracking, Send/Submit button, global persistence, and Gemini AI integration.
          draft: false
          prerelease: false
          files_glob: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova and Android SDK
        uses: android-actions/setup-android@v2

      - name: Build Cordova Android App
        run: |
          npm install -g cordova
          sdkmanager "platforms;android-33" "build-tools;33.0.2"
          cordova create tupp-app com.Gsrt07.app "Tupp Ai"
          cd tupp-app
          cordova platform add android
          cp -r ../* www/ || true
          cordova build android --debug

      - name: Copy APK
        run: |
          mkdir -p release-output
          cp tupp-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk release-output/Tupp_Ai_Debug.apk || find . -name "*.apk" -exec cp {} release-output/ \;
          ls -la release-output/

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          files: release-output/*.apk
          name: Tupp Ai v1.0.0 Release
          body: Automated build for Tupp Ai (com.Gsrt07.app) with live Firebase Homework Tracking, Send/Submit button, global persistence, and Gemini AI integration.
          draft: false
          prerelease: false
          files_glob: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

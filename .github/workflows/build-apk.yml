name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova and Android SDK tools
        run: |
          npm install -g cordova
          echo "y" | sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --sdk_root=${ANDROID_SDK_ROOT} "platforms;android-33" "build-tools;33.0.2" || true
          cordova create tupp-app com.Gsrt07.app "Tupp Ai"
          cd tupp-app
          cordova platform add android
          cp -r ../* www/ || true
          cordova build android --release

      - name: Locate and Copy APK
        run: |
          mkdir -p release-output
          find . -name "*.apk"
          APK_PATH=$(find . -name "app-release-unsigned.apk" -o -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" release-output/Tupp_Ai_com.Gsrt07.app.apk
          fi
          ls -la release-output

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          files: |
            release-output/Tupp_Ai_com.Gsrt07.app.apk
          name: Tupp Ai v1.0.0 Release
          body: Automated build for Tupp Ai (com.Gsrt07.app) with live Firebase Homework Tracking, Send/Submit button, global persistence, and Gemini AI integration.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
